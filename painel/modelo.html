<title>Cérebro do Elias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app de uma tela. Barra no topo, mapa do cérebro ocupando o resto,
   leitor de documento deslizando à direita (de baixo, no celular).
   Fontes e tom vêm da plataforma da Comunidade Vértice (Fraunces + Instrument Sans + JetBrains Mono). */
:root{
  --chao:#E7EAEF;
  --papel:#F7F8FA;
  --tinta:#151923;
  --tinta-2:#586174;
  --linha:#D0D6DF;
  --sinapse:#9AA4B8;
  --a-conteudo:#D4561A;
  --a-sites:#2A6CC4;
  --a-comunidade:#7A4BC8;
  --a-juridico:#1D8460;
  --a-vendas:#B33D6B;
  --a-pessoal:#9E7C0E;
  --a-sistema:#56627A;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-texto:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --raio:6px;
  --sombra:0 10px 30px -12px rgb(20 25 40 / .25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --chao:#0C1019; --papel:#141927; --tinta:#E6E9F0; --tinta-2:#97A0B4; --linha:#252C3D; --sinapse:#3C4560;
    --a-conteudo:#F27A36; --a-sites:#5C9CEB; --a-comunidade:#A483E8; --a-juridico:#3EBD8E; --a-vendas:#E26A9A; --a-pessoal:#D8B23C; --a-sistema:#8A95AC;
    --sombra:0 10px 30px -12px rgb(0 0 0 / .6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --chao:#0C1019; --papel:#141927; --tinta:#E6E9F0; --tinta-2:#97A0B4; --linha:#252C3D; --sinapse:#3C4560;
  --a-conteudo:#F27A36; --a-sites:#5C9CEB; --a-comunidade:#A483E8; --a-juridico:#3EBD8E; --a-vendas:#E26A9A; --a-pessoal:#D8B23C; --a-sistema:#8A95AC;
  --sombra:0 10px 30px -12px rgb(0 0 0 / .6);
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--chao);color:var(--tinta);font:15px/1.5 var(--f-texto);margin:0}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a-conteudo);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px;padding:14px 16px 16px}

/* Barra superior */
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.marca{display:flex;align-items:baseline;gap:12px;min-width:0;margin-right:auto}
.marca h1{font:700 26px/1 var(--f-display);letter-spacing:-.02em;margin:0;white-space:nowrap}
.marca h1 em{font-style:normal;color:var(--a-conteudo)}
.marca .sub{font:12px/1.3 var(--f-mono);color:var(--tinta-2);margin:0}

.alternador{display:inline-flex;border:1px solid var(--linha);border-radius:var(--raio);background:var(--papel);padding:2px}
.alternador button{border:0;background:none;padding:5px 12px;border-radius:4px;cursor:pointer;color:var(--tinta-2);font-weight:500;font-size:14px}
.alternador button[aria-pressed="true"],.alternador button[aria-selected="true"]{background:var(--tinta);color:var(--papel)}

.busca{position:relative;flex:1 1 240px;max-width:360px}
.busca input{width:100%;border:1px solid var(--linha);background:var(--papel);border-radius:var(--raio);padding:7px 12px 7px 34px}
.busca::before{content:"";position:absolute;left:12px;top:50%;width:11px;height:11px;border:1.6px solid var(--tinta-2);border-radius:50%;transform:translateY(-62%)}
.busca::after{content:"";position:absolute;left:22px;top:58%;width:6px;height:1.6px;background:var(--tinta-2);transform:rotate(45deg)}
.resultados{position:absolute;z-index:20;top:calc(100% + 6px);left:0;right:0;list-style:none;margin:0;padding:6px;background:var(--papel);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra);max-height:60vh;overflow:auto}
.resultados li button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:4px;cursor:pointer}
.resultados li button:hover,.resultados li button.ativo{background:var(--chao)}
.resultados .tit{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resultados .vazio{padding:8px;color:var(--tinta-2);font-size:14px}

/* Elementos compartilhados */
.ponto{width:9px;height:9px;border-radius:50%;background:var(--cor);flex:none}
.ponto.oco{background:transparent;border:1.6px solid var(--cor)}
.etiqueta{font:500 11px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--tinta-2)}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--f-texto);padding:4px 8px;border-radius:99px;border:1px solid var(--linha);background:var(--papel);color:var(--tinta)}

/* Área principal */
.palco{position:relative;min-height:0;display:grid}
.vista{min-height:0;border:1px solid var(--linha);border-radius:10px;background:var(--papel);overflow:hidden;position:relative}
#mapa{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#mapa:active{cursor:grabbing}

.ligacao{stroke:var(--sinapse);stroke-opacity:.6;stroke-width:1;transition:opacity .2s}
.ligacao.forte{stroke:var(--tinta-2);stroke-opacity:.9;stroke-width:1.4}
.no{cursor:pointer;transition:opacity .2s}
.no circle{fill:var(--cor);stroke:var(--papel);stroke-width:1.5}
.no[data-tipo="notion"] circle{fill:var(--papel);stroke:var(--cor);stroke-width:1.6}
.no[data-tipo="centro"] circle{fill:var(--tinta);stroke:var(--a-conteudo);stroke-width:3}
.no text{font:500 11.5px var(--f-texto);fill:var(--tinta);paint-order:stroke;stroke:var(--papel);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.no[data-tipo="area"] text{font:600 13px var(--f-texto)}
.no[data-tipo="centro"] text{font:700 17px var(--f-display)}
#mapa .no text{font-size:calc(var(--fs, 11.5px) / clamp(.6, var(--k, 1), 1))}
#mapa .no[data-tipo="area"]{--fs:13px} #mapa .no[data-tipo="centro"]{--fs:17px}
#mapa .no[data-tipo="biblio"],#mapa .no[data-tipo="notion"]{--fs:10.5px} #mapa .no[data-tipo="mapa"]{--fs:11px}
.no[data-tipo="notion"] text,.no[data-tipo="biblio"] text,.no[data-tipo="mapa"] text{display:none;font-size:10.5px;fill:var(--tinta-2)}
.no[data-tipo="mapa"] text{font-weight:600;fill:var(--tinta)}
#mapa.perto .no[data-tipo="mapa"] text,#mapa.muito-perto .no[data-tipo="biblio"] text{display:block}
.no.vizinho text,.no.achado text,.no.selecionado text{display:block!important}
.no[data-tipo="biblio"] circle{stroke-width:.8}
.sem-biblio .no[data-camada="biblioteca"],.sem-biblio .ligacao.biblio,.sem-biblio .anel-bib{display:none}
.no.selecionado circle{stroke:var(--tinta);stroke-width:2.5}
.apagado{opacity:.1}
.anel{fill:none;stroke:var(--linha);stroke-dasharray:3 5}
.anel-rotulo{font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;fill:var(--tinta-2)}
.setor-rotulo{font:600 12px var(--f-texto);fill:var(--cor)}
.camadas-extra{opacity:0;transition:opacity .4s}
.modo-camadas .camadas-extra{opacity:1}
.modo-camadas .ligacao{stroke-opacity:.28}
.modo-camadas .no[data-tipo="area"] text{display:none}
.modo-camadas .no[data-tipo="arquivo"]{--fs:10.5px}
.modo-camadas .ligacao.biblio{stroke-opacity:.12}

.legenda{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--papel) 88%,transparent);backdrop-filter:blur(6px);border:1px solid var(--linha);border-radius:8px;padding:10px 12px;max-width:calc(100% - 24px)}
.legenda ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 12px}
.legenda button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:2px 0;cursor:pointer;font-size:13px;color:var(--tinta)}
.legenda button[aria-pressed="true"]{text-decoration:underline;text-underline-offset:3px;font-weight:600}
.legenda .formas{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--tinta-2)}
.legenda .formas span{display:inline-flex;align-items:center;gap:6px}
.legenda .formas .alternar{font-size:12px;color:var(--tinta-2);border:1px solid var(--linha);border-radius:99px;padding:2px 9px}
.legenda .formas .alternar[aria-pressed="true"]{color:var(--tinta);border-color:var(--tinta-2);text-decoration:none;font-weight:500}
.ponto.pequeno{width:6px;height:6px}
.dica{position:absolute;right:12px;top:12px;font:12px var(--f-mono);color:var(--tinta-2);background:var(--papel);padding:4px 8px;border-radius:4px;border:1px solid var(--linha)}

/* Leitor */
.leitor{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--papel);border-left:1px solid var(--linha);box-shadow:var(--sombra);display:flex;flex-direction:column;z-index:10;border-radius:0 10px 10px 0}
.leitor header{padding:16px 18px 12px;border-bottom:1px solid var(--linha);display:grid;gap:8px}
.leitor .topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.leitor .fechar{margin-left:auto;border:1px solid var(--linha);background:none;border-radius:4px;width:30px;height:30px;cursor:pointer;font-size:18px;line-height:1}
.leitor h2{font:700 24px/1.15 var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
.leitor .meta{font:12px/1.4 var(--f-mono);color:var(--tinta-2);word-break:break-all}
.leitor .corpo{overflow:auto;padding:4px 18px 18px;min-height:0;flex:1}
.leitor footer{border-top:1px solid var(--linha);padding:12px 18px;display:grid;gap:8px;max-height:30%;overflow:auto}
.leitor footer .lista{display:flex;flex-wrap:wrap;gap:6px}
.leitor footer button.chip{cursor:pointer}
.md a.botao-externo,.botao-externo{display:inline-flex;align-items:center;gap:8px;justify-self:start;background:var(--tinta);color:var(--papel);text-decoration:none;padding:8px 14px;border-radius:var(--raio);font-weight:600;font-size:14px}

.md{font-size:15px;line-height:1.6;max-width:65ch}
.md h1{display:none}
.md h2{font:700 18px/1.25 var(--f-display);margin:22px 0 6px}
.md h3{font:600 15px/1.3 var(--f-texto);margin:16px 0 4px}
.md p,.md ul,.md ol{margin:8px 0}
.md ul,.md ol{padding-left:20px}
.md li{margin:3px 0}
.md a{color:var(--a-sites);text-underline-offset:2px}
a.wiki{color:var(--tinta);text-decoration:none;border-bottom:1.5px solid var(--a-conteudo);cursor:pointer}
.md code{font:13px var(--f-mono);background:var(--chao);padding:1px 5px;border-radius:3px;word-break:break-word}
.md pre{background:var(--chao);padding:12px;border-radius:6px;overflow:auto;font-size:12.5px}
.md pre code{background:none;padding:0;white-space:pre}
.md blockquote{margin:10px 0;padding:6px 12px;border-left:3px solid var(--a-pessoal);background:var(--chao);border-radius:0 4px 4px 0}
.md table{border-collapse:collapse;font-size:13.5px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--linha);padding:5px 8px;text-align:left;vertical-align:top}
.md input[type=checkbox]{margin-right:6px}

/* Aba Hoje */
#vista-hoje{overflow:auto}
.hoje{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;padding:20px;align-items:start}
.hoje .coluna{display:grid;gap:16px;min-width:0}
.bloco{border:1px solid var(--linha);border-radius:8px;padding:16px 18px;min-width:0;background:var(--papel)}
.bloco h2{font:700 20px/1.2 var(--f-display);margin:0 0 4px;letter-spacing:-.01em}
.bloco .etiqueta{display:block;margin-bottom:10px}
.saudacao{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.saudacao h2{font:700 30px/1.1 var(--f-display);margin:0;letter-spacing:-.02em}
.saudacao p{margin:0;color:var(--tinta-2)}
.tarefas{list-style:none;margin:0;padding:0;display:grid}
.tarefas li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:10px 0;border-top:1px solid var(--linha)}
.tarefas li:first-child{border-top:0}
.caixa{width:16px;height:16px;border:1.6px solid var(--tinta-2);border-radius:4px;margin-top:3px}
.tarefas .feito .caixa{background:var(--a-juridico);border-color:var(--a-juridico)}
.tarefas .feito .txt{text-decoration:line-through;color:var(--tinta-2)}
.tarefas .info{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--tinta-2)}
.tarefas .info button{border:0;background:none;padding:0;color:var(--tinta-2);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:12.5px}
.prioridades{margin:0;padding-left:20px;display:grid;gap:6px}
.prioridades li::marker{font-family:var(--f-mono);color:var(--tinta-2)}
.link-abrir{border:0;background:none;padding:0;color:var(--tinta);font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--a-conteudo);text-underline-offset:3px}

@media (max-width:760px){
  .app{padding:10px 16px 12px;gap:10px}
  .marca{width:100%}
  .marca h1{font-size:22px}
  .busca{max-width:none;flex-basis:100%;order:3}
  .leitor{top:auto;left:0;width:100%;height:72%;border-left:0;border-top:1px solid var(--linha);border-radius:12px 12px 10px 10px}
  .hoje{grid-template-columns:minmax(0,1fr);padding:14px}
  .dica{display:none}
  .legenda{font-size:12px;padding:8px 10px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="barra">
    <div class="marca">
      <h1>Cérebro do <em>Elias</em></h1>
      <p class="sub" id="resumo"></p>
    </div>
    <div class="alternador" role="tablist" aria-label="Seção">
      <button id="aba-grafo" role="tab" aria-selected="true" aria-controls="vista-grafo">Mapa</button>
      <button id="aba-hoje" role="tab" aria-selected="false" aria-controls="vista-hoje">Hoje</button>
    </div>
    <div class="busca">
      <input id="busca" type="search" placeholder="Buscar no cérebro" autocomplete="off" aria-label="Buscar no cérebro">
      <ul class="resultados" id="resultados" hidden></ul>
    </div>
    <div class="alternador" id="modos" aria-label="Forma do mapa">
      <button id="modo-neural" aria-pressed="true">Neural</button>
      <button id="modo-camadas" aria-pressed="false">Camadas</button>
    </div>
  </header>

  <main class="palco">
    <section class="vista" id="vista-grafo" role="tabpanel" aria-labelledby="aba-grafo">
      <svg id="mapa" aria-label="Mapa do cérebro"></svg>
      <div class="dica">arraste · role para zoom · clique para ler</div>
      <div class="legenda">
        <ul id="legenda-areas" aria-label="Filtrar por área"></ul>
        <div class="formas">
          <span><i class="ponto" style="--cor:var(--tinta-2)"></i>arquivo do cérebro</span>
          <span><i class="ponto oco" style="--cor:var(--tinta-2)"></i>página do Notion</span>
          <button id="ver-biblioteca" class="alternar" aria-pressed="true"><i class="ponto pequeno" style="--cor:var(--tinta-2)"></i>Biblioteca</button>
        </div>
      </div>
    </section>
    <section class="vista" id="vista-hoje" role="tabpanel" aria-labelledby="aba-hoje" hidden>
      <div class="hoje" id="hoje"></div>
    </section>
    <aside class="leitor" id="leitor" hidden aria-live="polite">
      <header>
        <div class="topo" id="leitor-chips">
          <button class="fechar" id="leitor-fechar" aria-label="Fechar">×</button>
        </div>
        <h2 id="leitor-titulo"></h2>
        <div class="meta" id="leitor-meta"></div>
      </header>
      <div class="corpo md" id="leitor-corpo"></div>
      <footer id="leitor-rodape"></footer>
    </aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const DADOS = __DADOS_DO_CEREBRO__;

const AREAS = {
  conteudo: "Conteúdo", sites: "Sites", comunidade: "Comunidade", juridico: "Jurídico",
  vendas: "Vendas", pessoal: "Pessoal", sistema: "Sistema"
};
const ORDEM_AREAS = Object.keys(AREAS);
const CAMADAS = { centro: "Centro", area: "Áreas", contexto: "Contexto", memoria: "Memória", acao: "Ação", biblioteca: "Biblioteca", notion: "Notion" };
const GENEROS = { mapa: "Mapa", conceito: "Conceito", nota: "Nota", projeto: "Projeto", fonte: "Fonte", pessoa: "Pessoa", diario: "Diário" };
const ORDEM_ANEIS = ["area", "contexto", "memoria", "acao", "biblioteca", "notion"];
const anelDo = (n) => n.forma === "area" ? "area" : n.camada;
const RAIO = { centro: 20, area: 11, arquivo: 7, mapa: 6, biblio: 3.6, notion: 4.5 };
// distância mínima entre vizinhos no mesmo anel, e entre faixas quando um anel não cabe numa volta só
const ESPACO = { area: 60, contexto: 26, memoria: 26, acao: 22, biblioteca: 10, notion: 14 };
const FAIXA = { biblioteca: 13 };

const guardar = (k, v) => { try { localStorage.setItem("cerebro:" + k, v); } catch (e) {} };
const lembrar = (k) => { try { return localStorage.getItem("cerebro:" + k); } catch (e) { return null; } };
const semAcento = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const chaveDe = (s) => semAcento(s).replace(/\s+/g, " ").trim();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const corDa = (area) => `var(--a-${AREAS[area] ? area : "sistema"})`;
const tipoDo = (n) => n.tipo === "centro" || n.camada === "centro" ? "centro" : n.camada === "notion" ? "notion"
  : n.tipo === "area" ? "area" : n.camada === "biblioteca" ? (n.genero === "mapa" ? "mapa" : "biblio") : "arquivo";
const fmtData = (iso) => { if (!iso) return ""; const [a, m, d] = iso.slice(0, 10).split("-"); return `${d}/${m}/${a}`; };

const nos = DADOS.nos.map((n) => ({ ...n, forma: tipoDo(n) }));
const porId = new Map(nos.map((n) => [n.id, n]));
// [[alvo]] vale pelo nome do arquivo, pelo título ou por um apelido (mesma regra do gerar.py)
const porChave = new Map();
nos.forEach((n) => [n.titulo, ...(n.apelidos || [])].forEach((t) => { const k = chaveDe(t); if (!porChave.has(k)) porChave.set(k, n); }));
const resolver = (alvo) => porId.get(alvo) || porChave.get(chaveDe(alvo));
nos.forEach((n) => { n.buscaT = chaveDe(n.titulo); n.busca = chaveDe([n.titulo, ...(n.apelidos || []), ...(n.tags || []), n.texto].join(" ")); });
const ligacoes = DADOS.ligacoes.filter((l) => porId.has(l.source) && porId.has(l.target)).map((l) => ({ ...l }));
const vizinhos = new Map(nos.map((n) => [n.id, new Set()]));
ligacoes.forEach((l) => { vizinhos.get(l.source).add(l.target); vizinhos.get(l.target).add(l.source); });
const grau = (id) => vizinhos.get(id).size;
const naBiblioteca = (n) => n.camada === "biblioteca";
const centro = nos.find((n) => n.forma === "centro");

/* ---------- resumo ---------- */
const nArq = nos.filter((n) => n.forma !== "notion").length;
const nBib = nos.filter(naBiblioteca).length;
const nNotion = nos.length - nArq;
document.getElementById("resumo").textContent =
  `${nArq} arquivos · ${ligacoes.length} ligações · gerado ${fmtData(DADOS.gerado_em)}`;

/* ---------- legenda ---------- */
let areaFiltro = null;
const legenda = document.getElementById("legenda-areas");
ORDEM_AREAS.filter((a) => nos.some((n) => n.area === a)).forEach((a) => {
  const li = document.createElement("li");
  li.innerHTML = `<button aria-pressed="false" data-area="${a}"><i class="ponto" style="--cor:${corDa(a)}"></i>${AREAS[a]}</button>`;
  legenda.appendChild(li);
});
legenda.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  areaFiltro = areaFiltro === b.dataset.area ? null : b.dataset.area;
  legenda.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.area === areaFiltro)));
  realcar();
});
const botaoBib = document.getElementById("ver-biblioteca");
let verBiblioteca = lembrar("biblioteca") !== "nao";
function aplicarBiblioteca() {
  botaoBib.setAttribute("aria-pressed", String(verBiblioteca));
  document.getElementById("vista-grafo").classList.toggle("sem-biblio", !verBiblioteca);
  guardar("biblioteca", verBiblioteca ? "sim" : "nao");
}
botaoBib.addEventListener("click", () => { verBiblioteca = !verBiblioteca; aplicarBiblioteca(); enquadrar(true); });

/* ---------- mapa ---------- */
const svg = d3.select("#mapa");
const raiz = svg.append("g");
const extra = raiz.append("g").attr("class", "camadas-extra");
const gLig = raiz.append("g");
const gNos = raiz.append("g");

// vista em camadas: cada área ganha uma fatia (raiz quadrada do tamanho, para as pequenas não sumirem)
const contagem = {}; nos.forEach((n) => { if (n.forma !== "centro") contagem[n.area] = (contagem[n.area] || 0) + 1; });
const pesos = {}; Object.entries(contagem).forEach(([a, c]) => { pesos[a] = Math.max(Math.sqrt(c), 3.2); });
const totalPesos = Object.values(pesos).reduce((a, b) => a + b, 0);
const setores = {}; let ang = -Math.PI / 2;
ORDEM_AREAS.forEach((a) => { if (!contagem[a]) return; const larg = (pesos[a] / totalPesos) * Math.PI * 2; setores[a] = [ang, ang + larg]; ang += larg; });
const raioDoAnel = {};
let cursor = 95;
ORDEM_ANEIS.forEach((c) => {
  const grupo = nos.filter((n) => anelDo(n) === c && n.forma !== "centro");
  if (!grupo.length) return;
  raioDoAnel[c] = cursor;
  let maior = cursor;
  ORDEM_AREAS.forEach((a) => {
    const doSetor = grupo.filter((n) => n.area === a)
      .sort((x, y) => (y.forma === "mapa") - (x.forma === "mapa") || x.titulo.localeCompare(y.titulo));
    if (!doSetor.length) return;
    const [i0, i1] = setores[a]; const larg = i1 - i0;
    let r = cursor, i = 0;
    while (i < doSetor.length) {
      const cabe = Math.max(1, Math.floor(larg * r / ESPACO[c]));
      const fatia = doSetor.slice(i, i + cabe);
      fatia.forEach((n, j) => { const t = i0 + larg * (j + 0.5) / fatia.length; n.alvoX = Math.cos(t) * r; n.alvoY = Math.sin(t) * r; });
      i += cabe; maior = Math.max(maior, r);
      if (i < doSetor.length) r += FAIXA[c] || 24;
    }
  });
  cursor = maior + (c === "area" ? 95 : 100);
});
const raioExterno = cursor - 100;
nos.forEach((n) => { if (n.alvoX === undefined) { n.alvoX = 0; n.alvoY = 0; } });

Object.entries(raioDoAnel).forEach(([c, r]) => {
  if (c === "area") return;
  extra.append("circle").attr("class", "anel" + (c === "biblioteca" ? " anel-bib" : "")).attr("r", r - 8);
  extra.append("text").attr("class", "anel-rotulo" + (c === "biblioteca" ? " anel-bib" : "")).attr("x", 6).attr("y", -r + 2).text(CAMADAS[c]);
});
Object.entries(setores).forEach(([a, [i0, i1]]) => {
  const t = (i0 + i1) / 2, r = raioExterno + 46;
  extra.append("text").attr("class", "setor-rotulo").style("--cor", corDa(a))
    .attr("x", Math.cos(t) * r).attr("y", Math.sin(t) * r)
    .attr("text-anchor", Math.abs(Math.cos(t)) < 0.2 ? "middle" : Math.cos(t) > 0 ? "start" : "end")
    .attr("dominant-baseline", "middle").text(AREAS[a]);
  extra.append("line").attr("class", "anel").attr("x1", Math.cos(i0) * 40).attr("y1", Math.sin(i0) * 40)
    .attr("x2", Math.cos(i0) * (raioExterno + 20)).attr("y2", Math.sin(i0) * (raioExterno + 20));
});

const linhas = gLig.selectAll("line").data(ligacoes).join("line")
  .attr("class", (l) => "ligacao" + (naBiblioteca(porId.get(l.source)) || naBiblioteca(porId.get(l.target)) ? " biblio" : ""));
const grupos = gNos.selectAll("g").data(nos, (d) => d.id).join("g")
  .attr("class", "no").attr("data-tipo", (d) => d.forma).attr("data-camada", (d) => d.camada).attr("tabindex", 0)
  .attr("role", "button").attr("aria-label", (d) => d.titulo)
  .style("--cor", (d) => corDa(d.area));
grupos.append("circle").attr("r", (d) => RAIO[d.forma]);
grupos.append("text").attr("x", (d) => RAIO[d.forma] + 5).attr("y", 4).text((d) => d.titulo);
grupos.filter((d) => d.forma === "centro").select("text").attr("x", 0).attr("y", 40).attr("text-anchor", "middle");

if (centro) { centro.fx = 0; centro.fy = 0; }
nos.forEach((n, i) => { if (n.forma !== "centro") { const t = i * 2.4; n.x = Math.cos(t) * (60 + i * 1.5); n.y = Math.sin(t) * (60 + i * 1.5); } });

const ligaBib = (l) => naBiblioteca(l.source) || naBiblioteca(l.target);
const sim = d3.forceSimulation(nos)
  .force("link", d3.forceLink(ligacoes).id((d) => d.id))
  .force("carga", d3.forceManyBody().distanceMax(900))
  .force("colisao", d3.forceCollide().radius((d) => RAIO[d.forma] + ({ notion: 4, biblio: 2, mapa: 8, arquivo: 22 }[d.forma] ?? 30)))
  .force("x", d3.forceX())
  .force("y", d3.forceY())
  .on("tick", desenhar)
  .on("end", () => { if (enquadrarNoFim && modo === "neural") enquadrar(true); enquadrarNoFim = false; });
let enquadrarNoFim = false;

function desenhar() {
  linhas.attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y).attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
  grupos.attr("transform", (d) => `translate(${d.x},${d.y})`);
}

let modo = lembrar("modo") === "camadas" ? "camadas" : "neural";
const reduzido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function aplicarModo(m, animar = true) {
  modo = m; guardar("modo", m);
  document.getElementById("modo-neural").setAttribute("aria-pressed", String(m === "neural"));
  document.getElementById("modo-camadas").setAttribute("aria-pressed", String(m === "camadas"));
  document.getElementById("vista-grafo").classList.toggle("modo-camadas", m === "camadas");
  if (m === "neural") {
    sim.force("link")
      .distance((l) => ligaBib(l) ? (l.tipo === "area" ? 140 : 34) : l.tipo === "notion" ? 40 : l.tipo === "area" ? 120 : 150)
      .strength((l) => ligaBib(l) ? (l.tipo === "area" ? 0.3 : 0.9 / Math.min(grau(l.source.id), grau(l.target.id)))
        : l.tipo === "notion" ? 0.8 : l.tipo === "area" ? 0.4 : 0.12);
    sim.force("carga").strength((d) => ({ centro: -1200, area: -700, notion: -60, biblio: -40, mapa: -220 }[d.forma] ?? -420));
    sim.force("x").x(0).strength(0.03); sim.force("y").y(0).strength(0.03);
  } else {
    sim.force("link").strength(0.004);
    sim.force("carga").strength(-6);
    sim.force("x").x((d) => d.alvoX).strength(0.6); sim.force("y").y((d) => d.alvoY).strength(0.6);
  }
  if (reduzido || !animar) { sim.stop(); sim.alpha(1); for (let i = 0; i < 360; i++) sim.tick(); desenhar(); enquadrar(false); }
  else { enquadrarNoFim = true; sim.alpha(0.9).restart(); if (m === "camadas") enquadrar(true); }
}

/* zoom: os nomes da biblioteca aparecem conforme você aproxima */
const elMapa = document.getElementById("mapa");
const zoom = d3.zoom().scaleExtent([0.1, 6]).on("zoom", (e) => {
  raiz.attr("transform", e.transform);
  elMapa.style.setProperty("--k", e.transform.k);
  elMapa.classList.toggle("perto", e.transform.k >= 0.85);
  elMapa.classList.toggle("muito-perto", e.transform.k >= 1.8);
});
svg.call(zoom).on("dblclick.zoom", null);
function enquadrar(animar) {
  const el = svg.node(); const w = el.clientWidth || 800, h = el.clientHeight || 600;
  let x0, x1, y0, y1;
  if (modo === "camadas") {
    const r = (verBiblioteca ? raioExterno : (raioDoAnel.acao || 385)) + 110;
    x0 = y0 = -r; x1 = y1 = r;
  } else {
    const vis = nos.filter((d) => verBiblioteca || !naBiblioteca(d));
    x0 = d3.min(vis, (d) => d.x) - 40; x1 = d3.max(vis, (d) => d.x) + 170;
    y0 = d3.min(vis, (d) => d.y) - 30; y1 = d3.max(vis, (d) => d.y) + 110; // espaço para a legenda
  }
  const k = Math.max(0.1, Math.min(w / (x1 - x0), h / (y1 - y0), 1.4));
  const t = d3.zoomIdentity.translate(w / 2 - k * (x0 + x1) / 2, h / 2 - k * (y0 + y1) / 2).scale(k);
  (animar ? svg.transition().duration(600) : svg).call(zoom.transform, t);
}
function focar(n) {
  const el = svg.node(); const w = el.clientWidth, h = el.clientHeight;
  const deslocar = !leitor.hidden && w > 760 ? -Math.min(230, w / 4) : 0;
  const k = naBiblioteca(n) ? 2 : 1.6;
  const dy = !leitor.hidden && w <= 760 ? -h * 0.3 : 0;
  svg.transition().duration(reduzido ? 0 : 600)
    .call(zoom.transform, d3.zoomIdentity.translate(w / 2 + deslocar - n.x * k, h / 2 + dy - n.y * k).scale(k));
}
window.addEventListener("resize", () => enquadrar(false));

/* arrastar nós */
grupos.call(d3.drag()
  .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.2).restart(); d.fx = d.x; d.fy = d.y; })
  .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
  .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); if (d.forma !== "centro") { d.fx = null; d.fy = null; } }));

/* realce: passar o mouse > busca > área > selecionado */
let sobre = null, selecionado = null, achados = null;
function realcar() {
  let foco = null, forte = null;
  if (sobre) { foco = new Set([sobre, ...vizinhos.get(sobre)]); forte = sobre; }
  else if (achados) foco = achados;
  else if (areaFiltro) foco = new Set(nos.filter((n) => n.area === areaFiltro).map((n) => n.id));
  else if (selecionado) { foco = new Set([selecionado, ...vizinhos.get(selecionado)]); forte = selecionado; }
  grupos.classed("apagado", (d) => foco && !foco.has(d.id))
    .classed("vizinho", (d) => !!forte && foco.has(d.id))
    .classed("achado", (d) => !!achados && achados.has(d.id))
    .classed("selecionado", (d) => d.id === selecionado);
  linhas.classed("apagado", (l) => foco && !(foco.has(l.source.id) && foco.has(l.target.id)) )
    .classed("forte", (l) => forte && (l.source.id === forte || l.target.id === forte));
}
grupos.on("mouseenter", (e, d) => { sobre = d.id; realcar(); })
  .on("mouseleave", () => { sobre = null; realcar(); })
  .on("click", (e, d) => abrir(d.id))
  .on("keydown", (e, d) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrir(d.id); } });

/* ---------- leitor ---------- */
const leitor = document.getElementById("leitor");
const WIKI = /\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g;
function renderMd(texto) {
  // troca [[links]] por links clicáveis, mas não mexe no que está dentro de código
  const comLinks = (texto || "").split(/(```[\s\S]*?```|`[^`\n]*`)/).map((parte, i) => i % 2 ? parte : parte.replace(WIKI, (m, alvo, rot) => {
    const n = resolver(alvo.trim());
    if (!n) return esc(rot || alvo.trim());
    return `<a class="wiki" data-no="${esc(n.id)}" href="#">${esc(rot || alvo.trim())}</a>`;
  })).join("");
  let html = window.marked ? marked.parse(comLinks, { gfm: true }) : `<pre>${esc(texto)}</pre>`;
  // legendas do Instagram e páginas do Notion vêm de fora: limpar antes de mostrar
  if (window.DOMPurify) html = DOMPurify.sanitize(html);
  const div = document.createElement("div"); div.innerHTML = html;
  div.querySelectorAll("a[href^='http']").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
  return div.innerHTML;
}
function chipArea(n) {
  return `<span class="chip"><i class="ponto${n.forma === "notion" ? " oco" : ""}" style="--cor:${corDa(n.area)}"></i>${AREAS[n.area] || n.area}</span>`;
}
function abrir(id) {
  const n = porId.get(id); if (!n) return;
  selecionado = id; realcar();
  document.querySelectorAll("#leitor-chips .chip").forEach((c) => c.remove());
  if (naBiblioteca(n) && !verBiblioteca) { verBiblioteca = true; aplicarBiblioteca(); }
  document.getElementById("leitor-chips").insertAdjacentHTML("afterbegin",
    chipArea(n) + `<span class="chip">${CAMADAS[n.camada] || n.camada}</span>` +
    (GENEROS[n.genero] ? `<span class="chip">${GENEROS[n.genero]}</span>` : ""));
  document.getElementById("leitor-titulo").textContent = n.titulo;
  const meta = [];
  if (n.caminho) meta.push(n.caminho);
  if (n.atualizado) meta.push("atualizado " + fmtData(n.atualizado));
  if (n.tags && n.tags.length) meta.push(n.tags.filter((t) => t !== "notion").map((t) => "#" + t).join(" "));
  document.getElementById("leitor-meta").textContent = meta.join(" · ");
  const corpo = document.getElementById("leitor-corpo");
  if (n.forma === "notion") {
    corpo.innerHTML = `<p>Página do Notion ligada à área <strong>${esc(AREAS[n.area] || n.area)}</strong>. O conteúdo fica no Notion; o cérebro guarda o atalho.</p>
      <p><a class="botao-externo" href="${esc(n.url)}" target="_blank" rel="noopener">Abrir no Notion ↗</a></p>`;
  } else {
    corpo.innerHTML = renderMd(n.texto);
    if (/^https?:\/\//.test(n.fonte || "")) {
      const onde = /notion\./.test(n.fonte) ? "página no Notion" : /instagram\./.test(n.fonte) ? "post no Instagram"
        : /youtu/.test(n.fonte) ? "vídeo no YouTube" : "link de origem";
      corpo.insertAdjacentHTML("beforeend", `<p class="etiqueta">Origem: <a href="${esc(n.fonte)}" target="_blank" rel="noopener">${onde} ↗</a></p>`);
    }
  }
  corpo.scrollTop = 0;
  const viz = [...vizinhos.get(id)].map((v) => porId.get(v)).sort((a, b) => (a.forma === "notion") - (b.forma === "notion") || a.titulo.localeCompare(b.titulo));
  document.getElementById("leitor-rodape").innerHTML = viz.length
    ? `<span class="etiqueta">Ligado a ${viz.length}</span><div class="lista">${viz.map((v) =>
        `<button class="chip" data-no="${esc(v.id)}"><i class="ponto${v.forma === "notion" ? " oco" : ""}" style="--cor:${corDa(v.area)}"></i>${esc(v.titulo)}</button>`).join("")}</div>`
    : "";
  leitor.hidden = false;
  if (!document.getElementById("vista-grafo").hidden) focar(n);
}
function fechar() { leitor.hidden = true; selecionado = null; realcar(); }
document.getElementById("leitor-fechar").addEventListener("click", fechar);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !leitor.hidden) fechar(); });
document.addEventListener("click", (e) => {
  const alvo = e.target.closest("[data-no]");
  if (alvo && !alvo.closest(".legenda")) { e.preventDefault(); if (porId.has(alvo.dataset.no)) abrir(alvo.dataset.no); }
});

/* ---------- busca ---------- */
const campo = document.getElementById("busca");
const lista = document.getElementById("resultados");
let ativo = 0, encontrados = [];
function buscar() {
  const q = chaveDe(campo.value);
  if (!q) { achados = null; lista.hidden = true; realcar(); return; }
  encontrados = nos.map((n) => {
    const pts = n.buscaT.startsWith(q) ? 3 : n.buscaT.includes(q) ? 2 : n.busca.includes(q) ? 1 : 0;
    return { n, pts };
  }).filter((x) => x.pts).sort((a, b) => b.pts - a.pts || a.n.titulo.localeCompare(b.n.titulo)).map((x) => x.n);
  achados = new Set(encontrados.map((n) => n.id));
  ativo = 0;
  lista.innerHTML = encontrados.length
    ? encontrados.slice(0, 10).map((n, i) => `<li><button data-no="${esc(n.id)}" class="${i === 0 ? "ativo" : ""}">
        <i class="ponto${n.forma === "notion" ? " oco" : ""}" style="--cor:${corDa(n.area)}"></i>
        <span class="tit">${esc(n.titulo)}</span><span class="etiqueta">${CAMADAS[n.camada] || ""}</span></button></li>`).join("")
      + (encontrados.length > 10 ? `<li class="vazio">e mais ${encontrados.length - 10}. Todas estão acesas no mapa.</li>` : "")
    : `<li class="vazio">Nada encontrado para “${esc(campo.value.trim())}”.</li>`;
  lista.hidden = false;
  realcar();
}
campo.addEventListener("input", buscar);
campo.addEventListener("focus", () => { if (campo.value.trim()) buscar(); });
campo.addEventListener("keydown", (e) => {
  const bts = lista.querySelectorAll("button");
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!bts.length) return;
    ativo = (ativo + (e.key === "ArrowDown" ? 1 : -1) + bts.length) % bts.length;
    bts.forEach((b, i) => b.classList.toggle("ativo", i === ativo));
  } else if (e.key === "Enter" && bts[ativo]) { escolher(bts[ativo].dataset.no); }
  else if (e.key === "Escape") { campo.value = ""; buscar(); }
});
lista.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { e.stopPropagation(); escolher(b.dataset.no); } });
function escolher(id) { lista.hidden = true; achados = null; mostrarAba("grafo"); abrir(id); }
document.addEventListener("click", (e) => { if (!e.target.closest(".busca")) lista.hidden = true; });

/* ---------- aba Hoje ---------- */
function montarHoje() {
  const tarefas = porId.get("tarefas"), prior = porId.get("prioridades");
  const diarios = nos.filter((n) => n.tipo === "diario").sort((a, b) => b.id.localeCompare(a.id));
  const ultimo = diarios[0];
  const itens = [];
  if (tarefas) {
    let secao = "";
    tarefas.texto.split("\n").forEach((l) => {
      const h = l.match(/^##\s+(.*)/); if (h) secao = h[1];
      const m = l.match(/^\s*-\s*\[( |x|X)\]\s+(.*)$/);
      if (m) itens.push({ feito: m[1] !== " ", partes: m[2].split(" · ").map((s) => s.trim()), secao });
    });
  }
  const abertas = itens.filter((i) => !i.feito), feitas = itens.filter((i) => i.feito);
  const linhaTarefa = (t) => {
    const [txt, area, ...resto] = t.partes;
    const a = semAcento(area || "");
    const info = [area && AREAS[a] ? `<span class="chip"><i class="ponto" style="--cor:${corDa(a)}"></i>${AREAS[a]}</span>` : (area ? esc(area) : ""),
      ...resto.map((r) => renderMd(r).replace(/^<p>|<\/p>\s*$/g, "").replace(/<a class="wiki" data-no="([^"]+)" href="#">/g, '<button data-no="$1">').replace(/<\/a>/g, "</button>"))].filter(Boolean).join(" · ");
    const tTxt = renderMd(txt).replace(/^<p>|<\/p>\s*$/g, "");
    return `<li class="${t.feito ? "feito" : ""}"><span class="caixa" aria-hidden="true"></span><span class="txt">${tTxt}</span><span class="info">${info}</span></li>`;
  };
  const priores = prior ? [...prior.texto.matchAll(/^##\s+(?:\d+\.\s*)?(.+)$/gm)].map((m) => m[1]) : [];
  const aviso = prior && /a confirmar/i.test(prior.texto);
  const hojeData = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  document.getElementById("hoje").innerHTML = `
    <div class="saudacao"><h2>Hoje</h2><p>${esc(hojeData)} · ${abertas.length} tarefas abertas · último registro de memória ${ultimo ? fmtData(ultimo.id) : "nenhum"}</p></div>
    <div class="coluna">
      <section class="bloco">
        <span class="etiqueta">Memória · tarefas</span>
        <h2>Para fazer</h2>
        <ul class="tarefas">${abertas.map(linhaTarefa).join("") || "<li>Nenhuma tarefa aberta.</li>"}</ul>
        ${feitas.length ? `<ul class="tarefas">${feitas.slice(0, 3).map(linhaTarefa).join("")}</ul>` : ""}
        <p class="etiqueta" style="margin:12px 0 0">Para marcar como feita, peça ao Claude ou edite <button class="link-abrir" data-no="tarefas">tarefas.md</button></p>
      </section>
    </div>
    <div class="coluna">
      <section class="bloco">
        <span class="etiqueta">Memória · prioridades${aviso ? " · a confirmar" : ""}</span>
        <h2>Foco</h2>
        <ol class="prioridades">${priores.map((p) => `<li>${esc(p)}</li>`).join("")}</ol>
        <p style="margin:12px 0 0"><button class="link-abrir" data-no="prioridades">Ver prioridades completas</button></p>
      </section>
      ${ultimo ? `<section class="bloco">
        <span class="etiqueta">Memória · diário</span>
        <h2>${esc(ultimo.titulo)}</h2>
        <div class="md">${renderMd(ultimo.texto)}</div>
      </section>` : ""}
    </div>`;
}

/* ---------- abas ---------- */
function mostrarAba(qual) {
  const grafo = qual === "grafo";
  document.getElementById("aba-grafo").setAttribute("aria-selected", String(grafo));
  document.getElementById("aba-hoje").setAttribute("aria-selected", String(!grafo));
  document.getElementById("vista-grafo").hidden = !grafo;
  document.getElementById("vista-hoje").hidden = grafo;
