<style>
:root{
  color-scheme: dark;
  --bg:#0A0C11; --bg2:#0E1118; --panel:#12161F; --panel2:#171C27; --raise:#1D2330; --line:#232A37; --line2:#303848;
  --ink:#EEF0F5; --ink2:#A9B1C2; --ink3:#727B8F;
  --amber:#FFB547; --amber-ink:#1B1204; --amber-text:#FFC46B; --amber-soft:rgba(255,181,71,.11); --amber-line:rgba(255,181,71,.38);
  --good:#4AD79D; --good-soft:rgba(74,215,157,.12); --warn:#F4C54E; --warn-soft:rgba(244,197,78,.13); --bad:#FF6F6F; --bad-soft:rgba(255,111,111,.13);
  --p-direito:#93B5FF; --p-empreendedorismo:#6FD8BC; --p-vendas:#FFA07E; --p-crescimento:#C6A8FF;
  --stripe-a:#EEF0F5; --stripe-b:#0A0C11;
  --glow:rgba(255,181,71,.07);
  --shadow:0 24px 48px -28px rgba(0,0,0,.8);

  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px;
}

  :root:not([data-theme="dark"]){

:root[data-theme="dark"]{ color-scheme: dark; }

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; font-family:var(--f-body); font-size:15px; line-height:1.5; color:var(--ink);
  background: radial-gradient(900px 520px at 88% -8%, var(--glow), transparent 62%), var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--amber-text)}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px; border-radius:6px}
::selection{background:var(--amber-soft)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.sm{width:15px;height:15px}
.ic.lg{width:22px;height:22px}
.mono{font-family:var(--f-mono); font-variant-numeric: tabular-nums}
.disp{font-family:var(--f-disp); text-transform:uppercase; letter-spacing:.02em}
.eyebrow{font-family:var(--f-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink3)}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid; grid-template-columns: 252px minmax(0,1fr); min-height:100%}
.side{
  position:sticky; top:0; height:100vh; height:100dvh; overflow:auto;
  background:var(--bg2); border-right:1px solid var(--line);
  padding:22px 14px 18px; display:flex; flex-direction:column; gap:22px;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center}

.brand-mark{background:var(--ink)!important;color:var(--bg)!important}
.brand-name{font-family:var(--f-disp); font-weight:800; font-size:22px; line-height:.9; text-transform:uppercase; letter-spacing:.02em}
.brand-name small{display:block; font-size:12.5px; font-weight:700; color:var(--amber-text); letter-spacing:.2em; margin-top:3px}
.nav{display:flex; flex-direction:column; gap:2px}
.nav button{
  display:flex; align-items:center; gap:12px; width:100%; border:0; background:transparent; color:var(--ink2);
  padding:10px 12px; border-radius:10px; font-weight:600; font-size:14.5px; text-align:left;
}
.nav button:hover{background:var(--panel); color:var(--ink)}
.nav button[aria-current="page"]{background:var(--raise); color:var(--ink); box-shadow: inset 0 0 0 1px var(--line2)}
.nav button[aria-current="page"] .ic{color:var(--amber)}
.nav .count{margin-left:auto; font-family:var(--f-mono); font-size:11.5px; color:var(--ink3)}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px}
.sprint{border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:14px}
.sprint .who{display:flex; align-items:center; gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--amber-soft);color:var(--amber-text);font-family:var(--f-disp);font-weight:800;font-size:15px;border:1px solid var(--amber-line);flex-shrink:0}
.sprint .h{font-weight:700; font-size:14px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar{height:6px; border-radius:99px; background:var(--line); overflow:hidden; margin:12px 0 8px}
.bar > i{display:block; height:100%; background:var(--amber); border-radius:99px}
.sprint .nums{display:flex; justify-content:space-between; font-family:var(--f-mono); font-size:11.5px; color:var(--ink2)}
.sprint .math{font-size:12px; color:var(--ink3); margin-top:6px; line-height:1.4}
.status-row{display:flex; gap:6px; flex-wrap:wrap; padding:0 4px}

.main{min-width:0; padding:28px clamp(16px, 3.4vw, 44px) 72px}
.topbar{display:none}
.tabbar{display:none}

/* ---------- atoms ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 15px;
  border-radius:10px; border:1px solid var(--line2); background:var(--panel2); color:var(--ink);
  font-weight:600; font-size:14px; white-space:nowrap; transition: background .15s, border-color .15s, transform .08s;
}
.btn:hover{background:var(--raise); border-color:var(--ink3)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.btn.primary{background:var(--amber); color:var(--amber-ink); border-color:transparent}
.btn.primary:hover{filter:brightness(1.06); background:var(--amber)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink2)}
.btn.ghost:hover{background:var(--panel2); color:var(--ink)}
.btn.sm{height:32px; padding:0 11px; font-size:13px; border-radius:9px}
.btn.xs{height:28px; padding:0 9px; font-size:12.5px; border-radius:8px}
.btn.danger{color:var(--bad)}
.btn.big{height:52px; font-size:16px; padding:0 22px; border-radius:12px}
.icon-btn{width:36px; padding:0}
.chip{
  display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 11px; border-radius:99px;
  border:1px solid var(--line2); background:transparent; color:var(--ink2); font-size:12.5px; font-weight:600; white-space:nowrap;
}
button.chip:hover{color:var(--ink); border-color:var(--ink3)}
.chip.on{background:var(--amber-soft); border-color:var(--amber-line); color:var(--amber-text)}
.chip .n{font-family:var(--f-mono); font-size:11px; opacity:.75}
.tag{display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:6px; font-size:11.5px; font-weight:600; background:var(--panel2); color:var(--ink2); border:1px solid var(--line); white-space:nowrap}
.tag.good{background:var(--good-soft); color:var(--good); border-color:transparent}
.tag.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.tag.bad{background:var(--bad-soft); color:var(--bad); border-color:transparent}
.tag.amber{background:var(--amber-soft); color:var(--amber-text); border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ink3)}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field > span{font-size:12.5px; font-weight:600; color:var(--ink2)}
.field > small{font-size:12px; color:var(--ink3)}
input[type=text],input[type=number],input[type=date],input[type=search],textarea,select{
  width:100%; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14.5px; color:var(--ink);
  transition:border-color .15s, box-shadow .15s;
}
textarea{resize:vertical; min-height:84px; line-height:1.5}
.raw-editor{width:100%; min-height:56vh; font-family:var(--f-mono); font-size:13.5px; line-height:1.6; white-space:pre; background:var(--bg2); border:1px solid var(--amber-line); border-radius:12px; padding:16px 18px; color:var(--ink)}
.raw-editor:focus{border-color:var(--amber-line); box-shadow:0 0 0 3px var(--amber-soft)}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--amber-line); box-shadow:0 0 0 3px var(--amber-soft)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
.check{display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--amber)}
.seg{display:inline-flex; padding:3px; border-radius:11px; background:var(--bg2); border:1px solid var(--line); gap:2px; flex-wrap:wrap}
.seg button{border:0; background:transparent; color:var(--ink2); height:32px; padding:0 13px; border-radius:8px; font-weight:600; font-size:13px}
.seg button[aria-pressed="true"]{background:var(--raise); color:var(--ink); box-shadow:0 0 0 1px var(--line2)}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r)}
.empty{padding:28px; text-align:center; color:var(--ink3); border:1px dashed var(--line2); border-radius:14px}

/* ---------- view header ---------- */
.vh{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:26px}
.vh h1{font-family:var(--f-disp); font-weight:800; text-transform:uppercase; font-size:clamp(36px, 5.2vw, 60px); line-height:.9; letter-spacing:.005em; margin:6px 0 0; text-wrap:balance}
.vh h1 em{font-style:normal; color:var(--amber-text)}
.vh p{margin:10px 0 0; color:var(--ink2); max-width:62ch}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.search{position:relative; min-width:0; flex:1 1 260px; max-width:420px}
.search .ic{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink3)}
.search input{padding-left:38px}
.rail{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin; margin-bottom:10px}

/* ---------- banner ---------- */
.banner{display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:12px 14px 12px 16px; border-radius:14px; background:var(--amber-soft); border:1px solid var(--amber-line); margin-bottom:22px}
.banner p{margin:0; flex:1 1 300px; font-size:14px}
.banner.info{background:var(--panel); border-color:var(--line)}

/* ---------- studio ---------- */
.studio{display:grid; grid-template-columns: minmax(340px, 410px) minmax(0,1fr); gap:24px; align-items:start}
.studio-left{position:sticky; top:20px; display:flex; flex-direction:column; gap:14px}
.slate{background:var(--panel); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:var(--shadow)}
.clap{position:relative; height:34px; background:var(--panel2); border-bottom:1px solid var(--line)}
.clap-arm,.clap-base{position:absolute; left:0; right:0; height:17px; background: repeating-linear-gradient(-58deg, var(--stripe-a) 0 15px, var(--stripe-b) 15px 30px)}
.clap-base{bottom:0}
.clap-arm{top:0; transform-origin:8px 17px; border-bottom:1px solid var(--stripe-b)}
.clap.go .clap-arm{animation:clap .75s cubic-bezier(.3,.7,.3,1)}
@keyframes clap{0%{transform:rotate(0)}35%{transform:rotate(-13deg)}62%{transform:rotate(0)}72%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
.slate-meta{display:grid; grid-template-columns: 1.3fr .7fr 1fr; border-bottom:1px solid var(--line)}
.slate-meta > div{padding:10px 14px; border-right:1px solid var(--line); min-width:0}
.slate-meta > div:last-child{border-right:0}
.slate-meta b{display:block; font-family:var(--f-disp); font-weight:700; font-size:19px; line-height:1.05; letter-spacing:.02em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.slot{padding:14px 16px 16px; border-bottom:1px solid var(--line)}
.slot-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.slot-h .disp{font-weight:700; font-size:15px; letter-spacing:.16em; color:var(--ink3)}
.pick{
  width:100%; text-align:left; border:1px solid var(--line); background:var(--bg2); border-radius:12px; padding:12px 14px;
  display:flex; gap:12px; align-items:flex-start; transition:border-color .15s, background .15s; color:var(--ink);
}
.pick:hover{border-color:var(--amber-line); background:var(--panel2)}
.pick.empty-pick{border-style:dashed; color:var(--ink3); align-items:center}
.pick .num{font-family:var(--f-mono); font-weight:600; font-size:13px; color:var(--amber-text); padding-top:2px; min-width:34px}
.pick .t{font-weight:700; font-size:15.5px; line-height:1.3}
.pick .s{font-size:13px; color:var(--ink2); margin-top:3px}
.pick .q{font-size:17px; font-weight:600; line-height:1.38; margin-top:2px}
.pick .chev{margin-left:auto; color:var(--ink3); align-self:center}
.compat{display:flex; gap:8px; align-items:flex-start; margin-top:10px; font-size:12.5px; color:var(--ink2); line-height:1.4}
.compat .dot{margin-top:5px; flex-shrink:0}
.gatebox{margin-top:12px; display:flex; flex-direction:column; gap:10px; padding:12px; border-radius:12px; background:var(--warn-soft)}
.gatebox .gtitle{display:flex; gap:8px; align-items:flex-start; font-size:13px; font-weight:600; color:var(--warn); line-height:1.4}
.gatebox input,.gatebox textarea{background:var(--panel)}
.extras{padding:4px 16px 14px; border-bottom:1px solid var(--line)}
.extras summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px; padding:10px 0; font-weight:600; font-size:14px; color:var(--ink2)}
.extras summary::-webkit-details-marker{display:none}
.extras summary .ic{transition:transform .2s}
.extras[open] summary .ic.chev2{transform:rotate(90deg)}
.extras .grid{display:flex; flex-direction:column; gap:12px; padding-bottom:6px}
.slate-actions{padding:16px; display:flex; flex-direction:column; gap:10px}
.slate-actions .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.gerar{width:100%}
.why{font-size:12.5px; color:var(--ink2); background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 11px; line-height:1.45}
.why b{color:var(--amber-text)}
.gate-err{font-size:13px; color:var(--warn); display:flex; gap:8px; align-items:flex-start}
.continua{margin:0 16px 12px; padding:10px 12px; border-radius:10px; background:var(--amber-soft); border:1px solid var(--amber-line); font-size:13px; display:flex; gap:10px; align-items:flex-start}
.continua p{margin:0; flex:1}

/* output */
.out{background:var(--panel); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); min-width:0}
.out-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; background:var(--panel); border-radius:18px 18px 0 0}
.out-bar .grow{flex:1}
.out-body{padding:22px clamp(16px, 2.4vw, 30px) 28px}
.headline{font-family:var(--f-mono); font-size:13px; color:var(--ink2); line-height:1.5; margin-bottom:14px}
.headline b{color:var(--amber-text); font-weight:600}
.checks{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:22px}
.hero{display:grid; grid-template-columns: 158px minmax(0,1fr); gap:24px; margin-bottom:26px; align-items:start}
.phone{
  width:158px; aspect-ratio:9/16; max-width:100%; border-radius:22px; position:relative; overflow:hidden;
  background: radial-gradient(120% 70% at 50% 30%, #262B36, #0B0C10 70%); border:1px solid #333a48; color:#fff;
  box-shadow: 0 18px 40px -18px rgba(0,0,0,.7);
}
.phone .tarja{position:absolute; top:14px; left:9px; right:9px; text-align:center; font-family:var(--f-disp); font-weight:800; font-size:13px; line-height:1.05; text-transform:uppercase; background:#FFB547; color:#1B1204; border-radius:5px; padding:5px 6px}
.phone .ph-hook{position:absolute; left:10px; right:10px; top:44%; transform:translateY(-50%); text-align:center; font-weight:700; font-size:13px; line-height:1.28; text-shadow:0 2px 10px rgba(0,0,0,.6)}
.phone .ph-hook span{background:rgba(0,0,0,.35); box-decoration-break:clone; -webkit-box-decoration-break:clone; padding:1px 4px; border-radius:3px}
.phone .handle{position:absolute; bottom:12px; left:10px; right:10px; font-family:var(--f-mono); font-size:9px; opacity:.75; display:flex; justify-content:space-between}
.phone .num1{position:absolute; top:52px; right:10px; width:24px; height:24px; border-radius:6px; background:#fff; color:#0B0C10; font-family:var(--f-disp); font-weight:800; display:grid; place-items:center; font-size:15px}
.phone .rec{position:absolute; top:-1px; left:50%; transform:translateX(-50%); width:44px; height:14px; background:#0B0C10; border-radius:0 0 9px 9px}
.hero-meta{display:flex; flex-direction:column; gap:16px; min-width:0}
.kv .eyebrow{margin-bottom:5px}
.kv p{margin:0; font-size:14.5px; color:var(--ink); line-height:1.5}
.timeline{display:flex; gap:3px; height:10px}
.timeline i{display:block; height:100%; border-radius:3px; background:var(--amber)}
.timeline i:nth-child(2){opacity:.55} .timeline i:nth-child(3){opacity:.8} .timeline i:nth-child(4){opacity:.4}
.tl-labels{display:flex; gap:3px; margin-top:6px}
.tl-labels span{font-family:var(--f-mono); font-size:10.5px; color:var(--ink3); overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.alts{display:flex; flex-direction:column; gap:8px}
.alt{display:flex; gap:10px; align-items:flex-start; font-size:14px; line-height:1.4}
.alt .num{font-family:var(--f-mono); color:var(--amber-text); font-size:12.5px; padding-top:1px; min-width:34px}
.alt .c{font-size:11.5px; color:var(--ink3); display:block}
.alt .btn{margin-left:auto}
.acts{border-top:1px solid var(--line)}
.act{display:grid; grid-template-columns: 104px minmax(0,1fr); gap:20px; padding:18px 0; border-bottom:1px solid var(--line)}
.act .tc{font-family:var(--f-mono); font-size:13px; color:var(--amber-text); font-weight:600}
.act .tc .lab{display:block; font-family:var(--f-disp); font-weight:700; font-size:15px; letter-spacing:.12em; color:var(--ink3); margin-top:4px; text-transform:uppercase}
.act .tc .rng{display:block; font-weight:400; color:var(--ink3); font-size:11px; margin-top:2px}
.fala{margin:0 0 12px; font-size:18.5px; line-height:1.52; font-weight:500; color:var(--ink); text-wrap:pretty}
.fala:last-child{margin-bottom:0}
.fala .who{display:inline-block; font-family:var(--f-mono); font-size:11px; font-weight:600; color:var(--ink2); border:1px solid var(--line2); border-radius:5px; padding:1px 6px; margin-right:8px; vertical-align:3px; text-transform:uppercase}
.fala.star{color:var(--amber-text); font-weight:700; font-size:20px}
.fala.star::before{content:"★ "; font-size:16px}
mark.conf{background:var(--warn-soft); color:var(--warn); border-radius:4px; padding:0 3px; font-weight:600}
mark.pre{background:var(--bad-soft); color:var(--bad); border-radius:4px; padding:0 3px; font-weight:600}
.blk{padding-top:26px}
.blk-h{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
.blk-h h3{margin:0; font-family:var(--f-disp); font-weight:800; font-size:22px; letter-spacing:.03em; text-transform:uppercase}
.legenda{white-space:pre-wrap; word-wrap:break-word; margin:0; font-family:var(--f-body); font-size:14.5px; line-height:1.6; background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:16px 18px}
.list{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
.list li{position:relative; padding-left:18px; font-size:14.5px; line-height:1.55; color:var(--ink)}
.list li::before{content:""; position:absolute; left:2px; top:.62em; width:6px; height:6px; border-radius:2px; background:var(--ink3)}
.list.warnlist li::before{background:var(--warn)}
.list.corr li::before{background:var(--amber)}
.nextcard{display:flex; gap:14px; align-items:center; flex-wrap:wrap; padding:14px 16px; border-radius:12px; border:1px solid var(--line); background:var(--bg2)}
.nextcard p{margin:0; flex:1 1 240px; font-weight:600}
.caret{display:inline-block; width:9px; height:18px; background:var(--amber); vertical-align:-3px; margin-left:3px; animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.thinking{display:flex; flex-direction:column; align-items:flex-start; gap:14px; padding:28px 4px}
.thinking .tcbig{font-family:var(--f-mono); font-size:52px; font-weight:500; color:var(--amber-text); line-height:1; letter-spacing:-.02em}
.thinking .tip{max-width:52ch; color:var(--ink2); font-size:15px; min-height:3em}
.scan{height:3px; width:100%; max-width:420px; border-radius:3px; background:linear-gradient(90deg, transparent, var(--amber), transparent); background-size:40% 100%; background-repeat:no-repeat; animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%{background-position:-40% 0}100%{background-position:140% 0}}
.errnote{margin-top:16px; padding:12px 14px; border-radius:12px; background:var(--bad-soft); color:var(--bad); font-size:14px; display:flex; gap:10px; align-items:flex-start}
.errnote.warn{background:var(--warn-soft); color:var(--warn)}
.storycards{display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:10px}
.story{border:1px solid var(--line); border-radius:12px; padding:14px; background:var(--bg2)}
.story .eyebrow{color:var(--amber-text)}
.story p{margin:6px 0 0; font-size:14px}
.ideas{display:grid; gap:12px}
.idea{border:1px solid var(--line); background:var(--bg2); border-radius:14px; padding:16px}
.idea-best{border-color:var(--amber-line); background:var(--amber-soft)}
.idea .top{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.idea h4{margin:0 0 6px; font-size:17px}
.idea q{display:block; font-size:16px; font-weight:600; margin:10px 0; quotes:"“" "”"}
.mode-panel{padding:16px; display:flex; flex-direction:column; gap:12px}

/* ---------- banks ---------- */
.cat-block{margin-bottom:26px}
.cat-h{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding:8px 0 10px; border-bottom:1px solid var(--line2)}
.cat-h h2{margin:0; font-family:var(--f-disp); font-weight:800; font-size:26px; text-transform:uppercase; letter-spacing:.02em}
.cat-h .range{font-family:var(--f-mono); font-size:12px; color:var(--ink3)}
.cat-h .fits{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap}
.cat-note{font-size:13px; color:var(--ink2); margin:8px 0 2px}
.hook{display:grid; grid-template-columns: 58px minmax(0,1fr) auto; gap:14px; padding:14px 10px; border-bottom:1px solid var(--line); align-items:start; border-radius:10px}
.hook:hover{background:var(--panel)}
.hook .num{font-family:var(--f-mono); font-size:13.5px; color:var(--amber-text); font-weight:600; padding-top:2px}
.hook .txt{font-size:16.5px; line-height:1.45; font-weight:500}
.hook .meta{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center}
.hook .acts2{display:flex; gap:6px; align-items:center}
.hook.last .txt{color:var(--ink3)}
.grid-cards{display:grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap:14px}
.tema{display:flex; flex-direction:column; gap:10px; padding:18px; background:var(--panel); border:1px solid var(--line); border-radius:16px}
.tema .nb{font-family:var(--f-disp); font-weight:800; font-size:46px; line-height:.85; color:var(--pc, var(--amber-text))}
.tema .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.tema h3{margin:0; font-size:17px; line-height:1.3}
.tema blockquote{margin:0; font-size:14.5px; color:var(--ink2); line-height:1.5; font-style:italic}
.tema .note{font-size:12.5px; color:var(--ink3)}
.tema .foot{margin-top:auto; display:flex; justify-content:space-between; align-items:center; gap:8px; padding-top:6px}
.tema.pend{border-style:dashed; background:transparent}
.tema.pend .nb{color:var(--ink3); opacity:.6}
.pdot{width:9px;height:9px;border-radius:3px;display:inline-block;background:var(--pc)}
.fmts{display:grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap:16px}
.fmt{display:grid; grid-template-columns: 76px minmax(0,1fr); gap:18px; padding:20px; background:var(--panel); border:1px solid var(--line); border-radius:18px}
.fmt h3{margin:0; font-family:var(--f-disp); font-weight:800; font-size:27px; text-transform:uppercase; letter-spacing:.02em; line-height:1}
.fmt .durb{font-family:var(--f-mono); font-size:12px; color:var(--amber-text); margin-top:4px}
.fmt dl{margin:12px 0 0; display:grid; gap:9px}
.fmt dt{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink3)}
.fmt dd{margin:2px 0 0; font-size:14px; line-height:1.5}
.fmt .foot{grid-column:1/-1; display:flex; align-items:center; gap:10px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:14px}
.fmt .foot .grow{flex:1}
.perfbar{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink2)}
.perfbar .bar{width:90px; margin:0}

/* mini frames (vídeo 9:16 — cores fixas, é tela de vídeo) */
.fv{width:72px; aspect-ratio:9/16; border-radius:11px; background:#0C0D12; border:1px solid #333a48; position:relative; overflow:hidden}
.fv i{position:absolute; display:block}
.fv .face{width:20px; height:20px; border-radius:50%; background:#E9E2D6; left:50%; transform:translateX(-50%)}
.fv-tela .face{top:14px}
.fv-tela .body{left:50%; transform:translateX(-50%); top:36px; width:34px; height:14px; border-radius:12px 12px 0 0; background:#3A4150}
.fv-tela .sat{left:0; right:0; bottom:0; height:50%; background:repeating-linear-gradient(135deg,#FFB547 0 6px,#E0569A 6px 12px,#56C1E0 12px 18px); border-top:1px solid #0C0D12}
.fv-react .big{inset:0; background:linear-gradient(180deg,#2A3140,#161A22)}
.fv-react .pip{left:6px; top:8px; width:30px; height:44px; border-radius:5px; background:#0C0D12; border:1.5px solid #FFB547}
.fv-react .face{top:16px; left:21px; width:14px; height:14px}
.fv-react .play{right:14px; bottom:30px; width:0; height:0; border-left:12px solid rgba(255,255,255,.55); border-top:8px solid transparent; border-bottom:8px solid transparent}
.fv-novelinha .face{top:48px; width:18px; height:18px}
.fv-novelinha .a{left:18px} .fv-novelinha .b{left:auto; right:0}
.fv-novelinha .f1{left:9px; transform:none; background:#E9E2D6}
.fv-novelinha .f2{left:auto; right:9px; transform:none; background:#D8C3A5}
.fv-novelinha .h1{left:7px; top:40px; width:22px; height:7px; border-radius:3px; background:#FFB547}
.fv-novelinha .h2{right:7px; top:40px; width:22px; height:7px; border-radius:3px; background:#56C1E0}
.fv-novelinha .s1,.fv-novelinha .s2{height:6px; border-radius:3px; background:rgba(255,255,255,.7)}
.fv-novelinha .s1{left:8px; top:20px; width:34px} .fv-novelinha .s2{right:8px; top:78px; width:30px; background:rgba(255,255,255,.4)}
.fv-comparativo .l{left:0; top:0; bottom:0; width:50%; background:rgba(255,95,95,.28)}
.fv-comparativo .r{right:0; top:0; bottom:0; width:50%; background:rgba(74,215,157,.28)}
.fv-comparativo .x,.fv-comparativo .v{top:50%; transform:translateY(-50%); font-weight:800; font-size:18px; line-height:1; color:#fff; font-family:var(--f-body)}
.fv-comparativo .x{left:11px} .fv-comparativo .v{right:10px}
.fv-narrado .b1,.fv-narrado .b2,.fv-narrado .b3{left:6px; right:6px; height:22px; border-radius:4px}
.fv-narrado .b1{top:10px; background:linear-gradient(90deg,#3B4A63,#6D5A8C)}
.fv-narrado .b2{top:36px; background:linear-gradient(90deg,#2F5E57,#7BA37C)}
.fv-narrado .b3{top:62px; background:linear-gradient(90deg,#704A3A,#C79063)}
.fv-narrado .wave{left:8px; right:8px; bottom:12px; height:14px; background:repeating-linear-gradient(90deg,#FFB547 0 2px,transparent 2px 5px); -webkit-mask:linear-gradient(0deg,#000 20%,transparent 21%,transparent 30%,#000 31%); opacity:.9}
.fv-trend .t1,.fv-trend .t2{left:10px; right:10px; height:7px; border-radius:3px; background:#fff}
.fv-trend .t1{top:48px} .fv-trend .t2{top:59px; right:20px}
.fv-trend .cap{left:14px; right:14px; bottom:22px; height:5px; border-radius:3px; background:#FFB547}
.fv-trend .note{top:12px; right:10px; width:8px; height:8px; border-radius:50%; background:#FFB547; box-shadow:-2px -9px 0 -2px #FFB547}
.fv-conversa .m{height:10px; border-radius:6px}
.fv-conversa .m1{left:6px; top:14px; width:38px; background:#3A4150}
.fv-conversa .m2{right:6px; top:30px; width:34px; background:#2E7D5B}
.fv-conversa .m3{left:6px; top:46px; width:44px; background:#3A4150}
.fv-conversa .m4{right:6px; top:62px; width:28px; background:#2E7D5B}
.fv-conversa .m5{left:6px; top:78px; width:32px; background:#3A4150}
.fv-conversa .sim{left:6px; bottom:8px; font-family:var(--f-mono); font-size:6.5px; color:#FFB547; letter-spacing:.08em}
.fv-lista .n{right:6px; top:8px; width:18px; height:18px; border-radius:5px; background:#fff; color:#0C0D12; font-family:var(--f-disp); font-weight:800; font-size:13px; display:grid; place-items:center}
.fv-lista .r1,.fv-lista .r2,.fv-lista .r3{left:8px; height:6px; border-radius:3px; background:rgba(255,255,255,.8)}
.fv-lista .r1{top:44px; width:44px} .fv-lista .r2{top:58px; width:36px; background:rgba(255,255,255,.55)} .fv-lista .r3{top:72px; width:48px; background:#FFB547}

/* ---------- biblioteca ---------- */
.kpis{display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:12px; margin-bottom:16px}
.kpi{padding:16px 18px; background:var(--panel); border:1px solid var(--line); border-radius:16px; min-width:0}
.kpi .v{font-family:var(--f-disp); font-weight:800; font-size:40px; line-height:1; margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.kpi .s{font-size:12.5px; color:var(--ink3); margin-top:6px}
.learn{display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; margin-bottom:28px}
.learn .card{padding:18px}
.learn h3{margin:0 0 14px; font-size:15px}
.bars{display:flex; flex-direction:column; gap:10px}
.brow{display:grid; grid-template-columns: minmax(0, 150px) minmax(0,1fr) 44px; gap:12px; align-items:center; font-size:13.5px}
.brow .lbl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.brow .track{height:10px; background:var(--bg2); border-radius:99px; overflow:hidden; position:relative}
.brow .track i{display:block; height:100%; background:var(--amber); border-radius:99px}
.brow .track .ref{position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--ink3)}
.brow .val{font-family:var(--f-mono); font-size:12.5px; text-align:right; color:var(--ink2)}
.lib{display:grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap:12px}
.item{text-align:left; display:flex; flex-direction:column; gap:10px; padding:16px; background:var(--panel); border:1px solid var(--line); border-radius:16px; color:var(--ink); transition:border-color .15s, transform .15s}
.item:hover{border-color:var(--amber-line)}
.item .top{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.item h4{margin:0; font-family:var(--f-disp); font-weight:800; font-size:21px; line-height:1.02; text-transform:uppercase; letter-spacing:.02em}
.item .sub{font-family:var(--f-mono); font-size:11.5px; color:var(--ink3); line-height:1.5}
.item .foot{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:auto}
.score{display:inline-flex; align-items:baseline; gap:4px; font-family:var(--f-disp); font-weight:800; font-size:24px; line-height:1}
.score small{font-family:var(--f-mono); font-size:10.5px; color:var(--ink3); font-weight:400}
.metrics-grid{display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:10px}
.rates{display:flex; gap:6px; flex-wrap:wrap}
.analysis{display:grid; gap:14px; margin-top:14px}
.analysis h5{margin:0 0 6px; font-size:12px; font-family:var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink3); font-weight:500}
.decision{padding:14px 16px; border-radius:12px; background:var(--amber-soft); border:1px solid var(--amber-line)}
.decision b{font-family:var(--f-disp); font-size:22px; text-transform:uppercase; letter-spacing:.03em; display:block}

/* ---------- perfil ---------- */
.pgrid{display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:16px; align-items:start}
.psec{padding:20px; display:flex; flex-direction:column; gap:14px}
.psec h2{margin:0; font-family:var(--f-disp); font-weight:800; font-size:24px; text-transform:uppercase; letter-spacing:.02em}
.psec .two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.mem{display:flex; flex-direction:column}
.mrow{display:grid; grid-template-columns: auto minmax(0,1fr) auto; gap:12px; align-items:start; padding:11px 0; border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow p{margin:0; font-size:14px; line-height:1.5}
.mrow.off p{color:var(--ink3); text-decoration:line-through}
.mrow small{display:block; color:var(--ink3); font-size:12px; margin-top:3px}
.voz{display:grid; gap:10px}
.voz .tags{display:flex; flex-wrap:wrap; gap:6px}
.prof-head{display:flex; gap:16px; align-items:center}
.prof-head .avatar{width:58px; height:58px; font-size:24px}

/* ---------- overlays ---------- */
.overlay{position:fixed; inset:0; background:var(--scrim); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding:max(24px, env(safe-area-inset-top, 0px)) 16px 24px; overflow:auto}
.sheet{width:100%; max-width:780px; background:var(--panel); border:1px solid var(--line2); border-radius:20px; box-shadow:0 40px 80px -30px rgba(0,0,0,.6); display:flex; flex-direction:column; max-height:calc(100dvh - 48px); overflow:hidden}
.sheet.wide{max-width:980px}
.sheet-h{display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0; font-family:var(--f-disp); font-weight:800; font-size:26px; text-transform:uppercase; letter-spacing:.02em; flex:1; line-height:1}
.sheet-tools{padding:12px 18px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
.sheet-b{padding:16px 18px 22px; overflow:auto}
.opt{width:100%; text-align:left; display:grid; grid-template-columns: 50px minmax(0,1fr) auto; gap:12px; padding:12px; border:0; border-radius:10px; background:transparent; color:var(--ink); align-items:start}
.opt:hover{background:var(--panel2)}
.opt.sel{background:var(--amber-soft)}
.opt .num{font-family:var(--f-mono); color:var(--amber-text); font-size:13px; padding-top:2px}
.opt .t{font-weight:600; font-size:15px; line-height:1.4}
.opt .s{font-size:12.5px; color:var(--ink3); margin-top:3px}
.prompter{position:fixed; inset:0; z-index:60; background:#050608; color:#F4F4F6; display:flex; flex-direction:column}
.prompter .scroller{flex:1; overflow:auto; padding:40vh 20px 60vh; scroll-behavior:auto}
.prompter .inner{max-width:900px; margin:0 auto}
.prompter .pl{margin:0 0 .9em; line-height:1.35; font-weight:600}
.prompter .pl.star{color:#FFC46B}
.prompter .pact{font-family:var(--f-mono); font-size:13px; color:#8990A0; letter-spacing:.14em; margin:1.4em 0 .6em}
.prompter.mirror .inner{transform:scaleX(-1)}
.prompter .guide{position:absolute; left:0; right:0; top:38vh; height:2px; background:rgba(255,181,71,.35); pointer-events:none}
.prompter .ctl{display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background:#0E1016; border-top:1px solid #222733}
.prompter .ctl .btn{background:#1A1E28; border-color:#2E3544; color:#F4F4F6}
.prompter .ctl label{display:flex; gap:8px; align-items:center; font-size:13px; color:#A9B1C2}
.prompter input[type=range]{accent-color:#FFB547; width:130px}
.toasts{position:fixed; right:18px; bottom:18px; z-index:70; display:flex; flex-direction:column; gap:8px; align-items:flex-end; pointer-events:none}
.toast{pointer-events:auto; max-width:380px; padding:11px 14px; border-radius:12px; background:var(--raise); border:1px solid var(--line2); box-shadow:var(--shadow); font-size:14px; display:flex; gap:10px; align-items:flex-start; animation:tin .2s ease-out}
.toast.good .ic{color:var(--good)} .toast.warn .ic{color:var(--warn)} .toast.bad .ic{color:var(--bad)}
@keyframes tin{from{transform:translateY(8px); opacity:0}}

/* ---------- avisos com solução e aberturas ---------- */
.fixbox{border:1px solid var(--warn-soft); background:var(--warn-soft); border-radius:14px; padding:14px 16px; margin-bottom:12px}
.fixbox-h{display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--warn); margin-bottom:10px}
.fixbox-h b{flex:1; color:var(--ink); font-size:15px}
.fixlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.fixlist li{padding-left:14px; border-left:3px solid var(--warn); display:flex; flex-direction:column; gap:3px}
.fixlist li.bad{border-left-color:var(--bad)}
.fixlist li b{font-size:14px}
.fixlist li span{font-size:13.5px; color:var(--ink2); line-height:1.5}
.aberturas{display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:10px}
.abre{border:1px solid var(--line); background:var(--bg2); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px}
.abre.on{border-color:var(--amber-line); background:var(--amber-soft)}
.abre-h{display:flex; align-items:center; gap:8px}
.abre-h b{flex:1; font-size:14px; text-transform:capitalize}
.abre .nb{font-family:var(--f-disp); font-weight:800; font-size:26px; line-height:1; color:var(--amber-text)}
.abre p{margin:0; font-size:13.5px; line-height:1.45}
.abre p.f{font-size:15px; font-weight:600}
.abre .k{display:block; font-family:var(--f-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink3); font-weight:500; margin-bottom:2px}
@media (max-width: 900px){ .aberturas{grid-template-columns: minmax(0,1fr)} }

/* ---------- manual do viral ---------- */
.manual{display:grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap:12px; align-items:start}
.man{padding:0}
.man summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; padding:16px 18px}
.man summary::-webkit-details-marker{display:none}
.man summary b{flex:1; font-size:15.5px}
.man summary .ic{color:var(--ink3); transition:transform .2s}
.man[open] summary .ic{transform:rotate(90deg)}
.man dl{margin:0; padding:0 18px 16px; display:flex; flex-direction:column; gap:10px}
.man dt{font-weight:700; font-size:13.5px; color:var(--amber-text)}
.man dd{margin:2px 0 0; font-size:14px; line-height:1.5; color:var(--ink)}
.man-fonte{margin:2px 18px 16px; font-size:11.5px; color:var(--ink3)}
@media (max-width: 760px){ .manual{grid-template-columns: minmax(0,1fr)} }

/* ---------- valor que transforma ---------- */
.valor{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px}
.vrow{border:1px solid var(--line); background:var(--bg2); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:4px; min-width:0}
.vrow .k{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink3)}
.vrow p{margin:0; font-size:14.5px; line-height:1.45}
.vrow.seg{border-color:var(--amber-line); background:var(--amber-soft); grid-column:1/-1}
.vrow.seg .k{color:var(--amber-text)}
@media (max-width: 760px){ .valor{grid-template-columns:minmax(0,1fr)} }

/* ---------- recomendações ---------- */
.rec{padding:16px; display:flex; flex-direction:column; gap:10px}
.rec-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.rec-h .ic{color:var(--amber)}
.rec-h b{font-size:15px; flex:1}
.rec p{margin:0; font-size:13.5px}
.rec-list{display:flex; flex-direction:column}
.rec-row{display:grid; grid-template-columns: 40px minmax(0,1fr) auto; gap:10px; align-items:start; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; line-height:1.4}
.rec-row:last-child{border-bottom:0}
.rec-row .num{font-family:var(--f-mono); font-size:12.5px; color:var(--amber-text); padding-top:1px}
.rec-row small{display:block; color:var(--ink3); font-size:12px; margin-top:3px}

/* ---------- virais ---------- */
.vgrid{display:grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap:14px}
.vcard{display:grid; grid-template-columns: 96px minmax(0,1fr); gap:16px; text-align:left; padding:14px; background:var(--panel); border:1px solid var(--line); border-radius:18px; color:var(--ink); transition:border-color .15s, transform .15s; align-items:start}
.vcard:hover{border-color:var(--amber-line); transform:translateY(-1px)}
.vthumb{width:96px; aspect-ratio:9/16; object-fit:cover; border-radius:12px; border:1px solid #333a48; background:#0C0D12; display:block; max-width:100%}
.vthumb.big{width:120px}
.vthumb-ph{display:grid; place-items:center; background:radial-gradient(120% 70% at 50% 30%, #262B36, #0B0C10 70%)}
.vthumb-ph span{font-family:var(--f-disp); font-weight:800; font-size:34px; color:#FFB547}
.vbody{display:flex; flex-direction:column; gap:8px; min-width:0}
.vbody .top{display:flex; gap:6px; flex-wrap:wrap}
.vbody h4{margin:0; font-family:var(--f-disp); font-weight:800; font-size:22px; line-height:1.02; text-transform:uppercase; letter-spacing:.02em}
.vver{margin:0; font-size:13.5px; color:var(--ink2); line-height:1.45; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.vempty{display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:14px}
.vstep{padding:22px; background:var(--panel); border:1px dashed var(--line2); border-radius:18px}
.vstep .nb{font-family:var(--f-disp); font-weight:800; font-size:44px; line-height:.9; color:var(--amber-text)}
.vstep h3{margin:10px 0 6px; font-size:17px}
.vstep p{margin:0; color:var(--ink2); font-size:14px}
.vhead{display:flex; gap:18px; align-items:flex-start}
.vkpis{grid-template-columns: repeat(5, minmax(0,1fr))}
.vkpis .kpi .v{font-size:32px}
.vkpis .kpi .s{font-size:12px; line-height:1.4}
.cmp-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:14px}
.cmp{width:100%; border-collapse:collapse; font-size:14px; min-width:640px}
.cmp th{text-align:left; font-family:var(--f-mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink3); font-weight:500; padding:10px 12px; border-bottom:1px solid var(--line); background:var(--panel2)}
.cmp td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top}
.cmp tr:last-child td{border-bottom:0}
.bcell{display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:13px; margin-bottom:4px}
.bcell:last-child{margin-bottom:0}
.fatores{display:flex; flex-direction:column; gap:10px}
.fator{display:grid; grid-template-columns: 124px 70px minmax(0,1fr); gap:12px; align-items:start; padding:10px 0; border-bottom:1px solid var(--line)}
.fator:last-child{border-bottom:0}
.fator p{margin:0; font-size:14.5px}
.fator small{display:block; color:var(--ink3); font-size:12.5px; margin-top:3px}
.peso{display:flex; gap:3px; padding-top:7px}
.peso i{width:10px; height:10px; border-radius:3px; background:var(--line2)}
.peso i.on{background:var(--amber)}
.estr{display:flex; flex-direction:column; border-left:2px solid var(--amber-line); padding-left:14px; gap:10px}
.estr-row{display:grid; grid-template-columns: 70px 110px minmax(0,1fr); gap:10px; font-size:14px; align-items:baseline}
.estr-row .mono{font-size:12px; color:var(--amber-text)}
.cols2{display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:18px}
.modelcard{padding:18px; border-radius:14px; background:var(--amber-soft); border:1px solid var(--amber-line)}
q.mq{display:block; font-size:17px; font-weight:600; margin:4px 0 6px; quotes:"“" "”"}
.vform{display:flex; flex-direction:column; gap:22px}
.vform section{display:flex; flex-direction:column; gap:8px}
.g2{display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; margin-top:8px}
.g3{display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:12px}
.vform-foot{position:sticky; bottom:-22px; background:var(--panel); padding:14px 0 4px; border-top:1px solid var(--line)}
.files{display:flex; gap:10px; flex-wrap:wrap}
.fprev{position:relative; width:78px; aspect-ratio:9/16; border-radius:10px; overflow:hidden; border:1px solid var(--line2)}
.fprev img{width:100%; height:100%; object-fit:cover; display:block}
.fprev .btn{position:absolute; top:4px; right:4px; background:rgba(0,0,0,.6); color:#fff; border-color:transparent; width:26px; height:26px}
.fadd{width:78px; aspect-ratio:9/16; border-radius:10px; border:1px dashed var(--line2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:11.5px; color:var(--ink2); cursor:pointer; text-align:center; padding:6px}
.fadd:hover{border-color:var(--amber-line); color:var(--ink)}
.bench-src{padding:14px 16px}
.bench-src summary{cursor:pointer; font-weight:600; display:flex; gap:8px; align-items:center; flex-wrap:wrap}

/* ---------- responsive ---------- */
@media (max-width: 1180px){ .vkpis{grid-template-columns: repeat(3, minmax(0,1fr))} }
@media (max-width: 760px){
  .vempty,.cols2,.g3{grid-template-columns: minmax(0,1fr)}
  .g2{grid-template-columns: minmax(0,1fr)}
  .vkpis{grid-template-columns: repeat(2, minmax(0,1fr))}
  .fator{grid-template-columns: minmax(0,1fr) auto}
  .fator > div{grid-column:1/-1}
  .estr-row{grid-template-columns: 60px minmax(0,1fr)}
  .estr-row > span:last-child{grid-column:2}
  .vgrid{grid-template-columns: minmax(0,1fr)}
  .vcard{grid-template-columns: 76px minmax(0,1fr)}
  .vthumb{width:76px}
  .vhead{flex-direction:column}
}
@media (max-width: 1180px){
  .studio{grid-template-columns: minmax(0,1fr)}
  .studio-left{position:static}
}
@media (max-width: 980px){
  .kpis{grid-template-columns: repeat(2, minmax(0,1fr))}
  .learn,.pgrid{grid-template-columns: minmax(0,1fr)}
}
@media (max-width: 860px){
  .app{grid-template-columns: minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex; align-items:center; gap:10px; position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--bg2); border-bottom:1px solid var(--line); padding:10px 16px}
  .topbar .brand-name{font-size:19px}
  .topbar .brand-mark{width:32px; height:32px}
  .topbar .grow{flex:1}
  .tabbar{display:flex; overflow-x:auto; scrollbar-width:none; position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--bg2); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom, 0px))}
  .tabbar::-webkit-scrollbar{display:none}
  .tabbar button{border:0; background:transparent; color:var(--ink3); display:flex; flex-direction:column; align-items:center; gap:3px; font-size:9.5px; font-weight:600; padding:6px 4px; border-radius:10px; flex:1 0 58px; min-width:58px; white-space:nowrap}
  .tabbar button[aria-current="page"]{color:var(--amber-text)}
  .main{padding:20px 16px 110px}
  .toasts{bottom:86px; right:12px; left:12px; align-items:stretch}
  .hero{grid-template-columns: 118px minmax(0,1fr); gap:16px}
  .phone{width:118px}
  .phone .ph-hook{font-size:10.5px}
  .phone .tarja{font-size:10.5px}
  .act{grid-template-columns: minmax(0,1fr); gap:8px}
  .act .tc{display:flex; gap:10px; align-items:baseline}
  .act .tc .lab,.act .tc .rng{display:inline; margin:0}
  .fala{font-size:17px}
  .overlay{padding:0; align-items:flex-end}
  .sheet{max-height:92dvh; border-radius:20px 20px 0 0}
  .hook{grid-template-columns: 44px minmax(0,1fr); }
  .hook .acts2{grid-column: 2}
  .fmt{grid-template-columns: 60px minmax(0,1fr); padding:16px}
  .fv{width:60px}
  .psec .two{grid-template-columns:1fr}
  .brow{grid-template-columns: minmax(0,110px) minmax(0,1fr) 40px}
}
@media (max-width: 420px){
  .hero{grid-template-columns: minmax(0,1fr)}
  .phone{width:132px}
  .kpi .v{font-size:32px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
