<title>Cérebro Vértice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
:root{
  /* Layout: a full-bleed star map of notes; instrument rail on the left, reading drawer on the right, search as the command line on top */
  color-scheme: dark;
  --void:#06070B; --deck:#0B0D14; --deck-2:#11141F; --deck-3:#191D2C;
  --rule:#252A3E; --rule-soft:#171A27;
  --ivory:#ECE7DC; --mist:#9397AA; --dust:#62667A;
  --amber:#F4B860; --amber-soft:rgba(244,184,96,.14); --amber-ink:#1B1307;
  --danger:#F0736A;
  --t-mapa:#F2C14E; --t-conceito:#F1ECDF; --t-nota:#86A8D4; --t-projeto:#FF8A4C; --t-fonte:#E66F9A; --t-pessoa:#57C4AE; --t-diario:#A596F0;
  --f-read:"Newsreader","Iowan Old Style",Georgia,serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --top-h:56px; --rail-w:268px; --drawer-w:468px;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--void);color:var(--ivory);font:14px/1.5 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
svg{display:block}

#app{position:relative;height:100%;display:grid;grid-template-rows:var(--top-h) minmax(0,1fr);grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-areas:"top top" "rail stage"}

/* top bar */
.topbar{grid-area:top;display:flex;align-items:center;gap:12px;padding-inline:16px;border-bottom:1px solid var(--rule-soft);background:var(--void);position:relative;z-index:40;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;flex:none}
.brand .logo{width:24px;height:24px;align-self:center}
.brand b{font:500 20px/1 var(--f-read);letter-spacing:.005em}
.brand small{font:500 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dust)}
.search{position:relative;flex:1;max-width:580px;margin-inline:auto;min-width:0}
.search-box{display:flex;align-items:center;gap:8px;height:38px;padding-inline:14px 8px;background:var(--deck-2);border:1px solid var(--rule);border-radius:999px;color:var(--dust)}
.search-box svg{width:17px;height:17px;flex:none}
.search-box:focus-within{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ivory)}
.search input::placeholder{color:var(--dust)}
kbd{font:500 11px/1 var(--f-mono);color:var(--mist);border:1px solid var(--rule);border-radius:5px;padding:4px 6px;background:var(--deck);white-space:nowrap}
.results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--deck-2);border:1px solid var(--rule);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.6);max-height:min(70vh,540px);overflow-y:auto;padding:6px;z-index:60}
.results-head{font:500 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dust);padding:10px 10px 8px}
.result{display:grid;grid-template-columns:10px minmax(0,1fr);gap:3px 10px;width:100%;text-align:left;padding:9px 10px;border-radius:9px}
.result[aria-selected="true"],.result:hover{background:var(--deck-3)}
.result .dot{margin-top:7px}
.result .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result .s{grid-column:2;color:var(--mist);font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.result .tg{font-family:var(--f-mono);font-size:11.5px;color:var(--dust)}
.result.create .t{color:var(--amber)}
.tips{display:grid;gap:6px;padding:4px 10px 10px;color:var(--mist);font-size:12.5px}
.tips code{font:12px var(--f-mono);color:var(--ivory);background:var(--deck-3);padding:1px 6px;border-radius:4px}
mark{background:rgba(244,184,96,.24);color:var(--ivory);border-radius:2px;padding:0 1px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--c,var(--mist))}
.dot.ghost{background:none;border:1px dashed var(--dust)}
.dot.plus{background:none;color:var(--amber);width:10px;height:auto;font:600 14px/1 var(--f-mono);margin-top:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding-inline:14px;border-radius:999px;font-weight:500;font-size:13px;white-space:nowrap;border:1px solid var(--rule);color:var(--ivory);background:var(--deck-2);flex:none}
.btn:hover{border-color:#384062;background:var(--deck-3)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.primary:hover{background:#F8C985;border-color:#F8C985}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#1d0806}
.btn.small{height:30px;padding-inline:11px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:default}
.ask-btn{border-color:rgba(244,184,96,.45);color:var(--amber)}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--mist);flex:none}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{background:var(--deck-3);color:var(--ivory)}
.icon-btn[aria-pressed="true"]{color:var(--amber);background:var(--amber-soft)}
.icon-btn.sm{width:26px;height:26px}
.icon-btn.sm svg{width:14px;height:14px}
.actions{display:flex;align-items:center;gap:4px;flex:none;position:relative}
.menu{position:absolute;top:calc(100% + 10px);right:0;width:290px;background:var(--deck-2);border:1px solid var(--rule);border-radius:14px;padding:6px;box-shadow:0 24px 60px rgba(0,0,0,.6);z-index:60}
.menu button{display:flex;gap:11px;align-items:center;width:100%;padding:9px 10px;border-radius:8px;text-align:left;font-size:13px}
.menu button svg{width:17px;height:17px;color:var(--mist);flex:none}
.menu button:hover{background:var(--deck-3)}
.menu button small{display:block;color:var(--dust);font-size:11.5px;line-height:1.35;margin-top:1px}
.menu hr{border:0;border-top:1px solid var(--rule);margin:6px 4px}
.menu .label{font:500 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dust);padding:10px 10px 6px}

/* rail */
.rail{grid-area:rail;overflow-y:auto;background:var(--deck);border-right:1px solid var(--rule-soft);padding:18px 14px 20px;display:flex;flex-direction:column;gap:24px;min-width:0}
.rail h3{margin:0 0 8px;padding-inline:8px;font:500 10.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dust);display:flex;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:1px}
.region{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:7px;font-size:13px;text-align:left}
.region:hover{background:var(--deck-2)}
.region .n{margin-left:auto;font:12px var(--f-mono);color:var(--mist);font-variant-numeric:tabular-nums}
.region[aria-pressed="false"]{opacity:.35}
.region[aria-pressed="false"] .dot{background:none;border:1px solid var(--c)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 8px;font-size:13px;cursor:pointer;border-radius:7px}
.switch:hover{background:var(--deck-2)}
.switch input{appearance:none;-webkit-appearance:none;margin:0;width:30px;height:18px;border-radius:9px;background:var(--deck-3);border:1px solid var(--rule);position:relative;flex:none;cursor:pointer;transition:background .15s,border-color .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--mist);transition:transform .15s,background .15s}
.switch input:checked{background:var(--amber-soft);border-color:var(--amber)}
.switch input:checked::after{transform:translateX(12px);background:var(--amber)}
.range{display:grid;gap:2px;padding:6px 8px 2px;font-size:12.5px;color:var(--mist)}
.range input{width:100%;accent-color:var(--amber);margin:0}
.list-btn{display:flex;align-items:center;gap:9px;width:100%;padding:5px 8px;border-radius:7px;text-align:left;font-size:13px;min-width:0}
.list-btn:hover{background:var(--deck-2)}
.list-btn .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.list-btn small{color:var(--dust);font:11px var(--f-mono);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rail .chips{padding-inline:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--rule);font:12px/1.5 var(--f-mono);color:var(--mist);background:var(--deck);max-width:100%}
.chip:hover{border-color:var(--amber);color:var(--ivory)}
.chip b{font-weight:400;color:var(--dust)}
.chip svg{width:13px;height:13px;flex:none}
.chip.missing{border-style:dashed;color:var(--dust)}
.chip.link-chip{font-family:var(--f-ui);font-size:12.5px;color:var(--ivory)}
.muted,.muted-note{color:var(--dust);font-size:12.5px;margin:0}
.muted-note{padding-inline:8px}
.stats{font:11.5px/1.8 var(--f-mono);color:var(--dust);border-top:1px solid var(--rule-soft);padding:14px 8px 0;margin-top:auto;display:grid;grid-template-columns:1fr auto;column-gap:10px}
.stats strong{color:var(--ivory);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}

/* stage */
.stage{grid-area:stage;position:relative;overflow:hidden;min-width:0;background:radial-gradient(ellipse 70% 60% at 50% 45%,#0F1222 0%,var(--void) 72%)}
#stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#graph{position:absolute;inset:0}
.hud{position:absolute;left:16px;bottom:16px;display:flex;gap:6px;z-index:5}
.hud .icon-btn{background:rgba(11,13,20,.85);border:1px solid var(--rule)}
.focus-chip{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;display:flex;align-items:center;gap:10px;padding:5px 6px 5px 14px;border-radius:999px;background:rgba(11,13,20,.92);border:1px solid rgba(244,184,96,.5);font-size:12.5px;z-index:5;max-width:calc(100% - 180px);white-space:nowrap}
.focus-chip > span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;flex:none}
.seg button{font:12px var(--f-mono);padding:2px 9px;color:var(--mist)}
.seg button[aria-pressed="true"],.seg button[aria-checked="true"]{background:var(--amber);color:var(--amber-ink)}
.layout-seg{margin-inline:6px;display:flex;flex-wrap:wrap;gap:6px}
.layout-seg button{padding:5px 11px;font-size:12px;border:1px solid var(--rule);border-radius:999px;color:var(--mist);background:var(--deck)}
.layout-seg button:hover{color:var(--ivory);border-color:#384062}
.layout-seg button[aria-checked="true"]{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.grp-bulk button{font:inherit;letter-spacing:.08em;color:var(--mist);padding:0 2px}
.grp-bulk button:hover{color:var(--amber)}
.grp-row{display:flex;align-items:center;gap:2px;border-radius:7px}
.grp-row:hover{background:var(--deck-2)}
.grp-row .region{flex:1;min-width:0}
.grp-row .region:hover{background:none}
.grp-eye,.grp-only{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--dust);flex:none}
.grp-eye:hover,.grp-only:hover{color:var(--ivory);background:var(--deck-3)}
.grp-only{font:500 10px/1 var(--f-mono);letter-spacing:.06em;width:auto;padding-inline:6px;opacity:0}
.grp-row:hover .grp-only,.grp-only:focus-visible{opacity:1}
.grp-row.off .region{opacity:.35}
.grp-eye svg{width:15px;height:15px}
.seg-hint{margin-top:8px;font-size:12px;line-height:1.45}
.theme-row .dot{background:none;border:1.5px solid var(--c)}
@media (min-width:761px){
  #app.drawer-open .focus-chip,#app.drawer-open .banner{left:calc((100% - min(var(--drawer-w),100%)) / 2)}
  #app.drawer-open .focus-chip{max-width:calc(100% - min(var(--drawer-w),100%) - 150px)}
}
.hovercard{position:absolute;z-index:8;pointer-events:none;width:270px;background:rgba(17,20,31,.97);border:1px solid var(--rule);border-radius:12px;padding:11px 13px 12px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.hovercard .k{font:500 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.hovercard h4{margin:7px 0 5px;font:500 17px/1.2 var(--f-read);text-wrap:balance}
.hovercard p{margin:0;color:var(--mist);font-size:12.5px;line-height:1.45}
.hovercard .m{margin-top:9px;font:11px var(--f-mono);color:var(--dust)}
.overlay-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px 16px;z-index:4;pointer-events:none}
.overlay-msg .box{pointer-events:auto;max-width:440px;text-align:center}
.overlay-msg h2{font:500 30px/1.15 var(--f-read);margin:8px 0 10px;text-wrap:balance}
.overlay-msg p{color:var(--mist);margin:0 0 20px}
.overlay-msg .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.eyebrow{font:500 10.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:6;background:rgba(11,13,20,.92);border:1px solid var(--rule);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--mist);max-width:calc(100% - 32px);text-align:center}
.thinking{display:flex;align-items:center;gap:10px;color:var(--mist);font-size:13px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:pulse 1.2s ease-in-out infinite;flex:none}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

/* drawer */
.drawer{position:absolute;top:var(--top-h);right:0;bottom:0;width:min(var(--drawer-w),100%);background:var(--deck);border-left:1px solid var(--rule);z-index:30;display:flex;flex-direction:column;box-shadow:-30px 0 70px rgba(0,0,0,.4)}
.drawer-head{display:flex;align-items:center;gap:2px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--rule-soft);flex:none;min-height:56px}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--mist));white-space:nowrap;overflow:hidden}
.crumb svg{width:15px;height:15px}
.head-acts{display:flex;align-items:center;gap:2px}
.drawer-body{flex:1;overflow-y:auto;padding:24px 24px 48px;min-height:0}
.drawer-body.editing{display:flex;flex-direction:column;padding-bottom:16px}
.note-title{font:500 34px/1.1 var(--f-read);margin:0 0 10px;text-wrap:balance;letter-spacing:-.01em;overflow-wrap:anywhere}
.note-title.ghost-title{color:var(--mist);font-style:italic}
.note-meta{font:11.5px/1.5 var(--f-mono);color:var(--dust);display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:16px}
.lede{color:var(--mist);margin:0 0 18px;font-size:14px}
.prose{font:17px/1.62 var(--f-read);color:#E2DDD2;max-width:65ch;overflow-wrap:break-word}
.prose>:first-child{margin-top:0}
.prose h1,.prose h2,.prose h3,.prose h4{font-family:var(--f-read);font-weight:600;line-height:1.2;margin:1.3em 0 .45em;color:var(--ivory);text-wrap:balance}
.prose h1{font-size:1.4em}.prose h2{font-size:1.22em}.prose h3,.prose h4{font-size:1.06em}
.prose p{margin:0 0 .8em}
.prose a{color:var(--amber);text-decoration:underline;text-decoration-color:rgba(244,184,96,.4);text-underline-offset:3px}
.prose a.wl{color:var(--ivory);text-decoration:none;background:rgba(244,184,96,.09);box-shadow:inset 0 -1px 0 rgba(244,184,96,.6);border-radius:3px;padding:0 2px}
.prose a.wl:hover{background:rgba(244,184,96,.22)}
.prose a.wl-missing{color:var(--mist);background:none;box-shadow:inset 0 -1px 0 var(--dust)}
.prose blockquote{margin:1em 0;padding:.1em 0 .1em 1em;border-left:2px solid var(--amber);color:var(--mist);font-style:italic}
.prose code{font:.8em var(--f-mono);background:var(--deck-3);padding:.12em .38em;border-radius:4px}
.prose pre{background:var(--deck-2);border:1px solid var(--rule);border-radius:9px;padding:12px 14px;overflow-x:auto}
.prose pre code{background:none;padding:0}
.prose ul,.prose ol{padding-left:1.3em;margin:0 0 .9em}
.prose li{margin:.2em 0}
.prose li:has(> input[type=checkbox]){list-style:none;margin-left:-1.25em}
.prose input[type=checkbox]{accent-color:var(--amber);width:15px;height:15px;margin:0 8px 0 0;vertical-align:-2px;cursor:pointer}
.prose input[type=checkbox]:disabled{cursor:default}
.prose hr{border:0;border-top:1px solid var(--rule);margin:1.6em 0}
.prose table{border-collapse:collapse;font:14px var(--f-ui);display:block;overflow-x:auto;max-width:100%}
.prose th,.prose td{border:1px solid var(--rule);padding:6px 10px;text-align:left}
.prose img{max-width:100%;border-radius:6px}
.prose .empty-body{color:var(--dust);font-style:italic}
.section{margin-top:30px;border-top:1px solid var(--rule-soft);padding-top:16px}
.section h3{margin:0 0 12px;font:500 10.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dust);display:flex;align-items:center;gap:8px}
.section h3 svg{width:14px;height:14px;color:var(--amber)}
.section h3 .n{color:var(--mist)}
.section .muted + .btn{margin-top:10px}
.ref{display:flex;align-items:flex-start;gap:8px;padding:10px 10px 10px 12px;border-radius:10px;border:1px solid var(--rule-soft);background:var(--deck-2);margin-bottom:8px}
.ref:hover{border-color:var(--rule)}
.ref-main{flex:1;min-width:0;text-align:left;display:block}
.ref .rt{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px}
.ref .rs{display:block;color:var(--mist);font-size:12.5px;margin-top:4px;line-height:1.45}
.row-acts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}

/* editor */
.editor{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.field label{display:flex;justify-content:space-between;gap:10px;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dust);margin-bottom:7px}
.field label .hint{letter-spacing:0;text-transform:none;color:var(--dust);font-size:11px}
.field.grow{flex:1;display:flex;flex-direction:column;min-height:280px}
.inp{width:100%;background:var(--deck-2);border:1px solid var(--rule);border-radius:9px;color:var(--ivory);padding:9px 12px;outline:none}
.inp:focus{border-color:var(--amber)}
.inp.title{font:500 24px/1.25 var(--f-read);padding:8px 12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.field{flex:1;min-width:130px}
.row>.field.wide{flex:2}
select.inp{appearance:auto}
.ta-wrap{position:relative;flex:1;display:flex;min-height:240px}
#edBody{resize:none;flex:1;font:13.5px/1.7 var(--f-mono);tab-size:2}
.ac{position:absolute;z-index:5;width:270px;max-width:calc(100% - 8px);background:var(--deck-3);border:1px solid var(--rule);border-radius:11px;padding:4px;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.ac button{display:flex;gap:9px;align-items:center;width:100%;padding:7px 9px;border-radius:7px;text-align:left;font-size:13px}
.ac button span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ac button svg{width:14px;height:14px;color:var(--amber);flex:none}
.ac button[aria-selected="true"]{background:var(--amber-soft)}
.edit-foot{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;font:11.5px var(--f-mono);color:var(--dust)}
.err{color:var(--danger);font-size:12.5px;margin:6px 0 0}
.ask-form{display:flex;flex-direction:column;gap:10px}
.ask-form textarea{resize:vertical;min-height:84px;font-size:14.5px;line-height:1.5}
.ask-acts{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.ask-acts .hint{margin-right:auto;font:11px var(--f-mono);color:var(--dust)}
.ask-out{margin-top:22px}

<script>
(() => {
'use strict';

/* ---------- basics ---------- */
const root = document.documentElement;
const cssVar = n => getComputedStyle(root).getPropertyValue(n).trim();
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const TYPE_LIST = [
  { key: 'mapa', label: 'Mapa', plural: 'Mapas' },
  { key: 'conceito', label: 'Conceito', plural: 'Conceitos' },
  { key: 'nota', label: 'Nota', plural: 'Notas' },
  { key: 'projeto', label: 'Projeto', plural: 'Projetos' },
  { key: 'fonte', label: 'Fonte', plural: 'Fontes' },
  { key: 'pessoa', label: 'Pessoa', plural: 'Pessoas' },
  { key: 'diario', label: 'Diário', plural: 'Diário' },
];
const TYPE = {};
for (const t of TYPE_LIST) { t.color = cssVar('--t-' + t.key) || '#cccccc'; TYPE[t.key] = t; }
const C = { ivory: cssVar('--ivory'), mist: cssVar('--mist'), dust: cssVar('--dust'), amber: cssVar('--amber'), void: cssVar('--void') };
const LINK_RE = /\[\[([^\[\]\n]+?)\]\]/g;
const isTouch = matchMedia('(hover: none)').matches;
const mqMobile = matchMedia('(max-width: 760px)');
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const uid = () => 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const LS = 'cerebro-vertice:';
const lsGet = (k, d) => { try { const v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch {} };
const debounce = (fn, ms) => { let t; const f = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; f.cancel = () => clearTimeout(t); return f; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hm = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const fmtDate = ts => new Date(ts).toLocaleDateString('pt-BR', { day: 'numeric', month: 'short', year: 'numeric' });
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const rtf = new Intl.RelativeTimeFormat('pt-BR', { numeric: 'auto' });
function ago(ts) {
  if (!ts) return '';
  const s = (ts - Date.now()) / 1000, a = Math.abs(s);
  if (a < 60) return 'agora';
  if (a < 3600) return rtf.format(Math.round(s / 60), 'minute');
  if (a < 86400) return rtf.format(Math.round(s / 3600), 'hour');
  if (a < 86400 * 30) return rtf.format(Math.round(s / 86400), 'day');
  return fmtDate(ts);
}
function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function parseLink(inner) {
  const bar = inner.indexOf('|');
  const left = bar >= 0 ? inner.slice(0, bar) : inner;
  const target = left.split('#')[0].trim();
  const alias = (bar >= 0 ? inner.slice(bar + 1) : left).trim();
  return { target, alias: alias || target };
}
function plain(md) {
  return String(md || '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/\[\[([^\[\]\n]+?)\]\]/g, (m, i) => parseLink(i).alias)
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/^\s*(?:[-*+]|\d+[.)])\s+\[[ xX]\]\s*/gm, '')
    .replace(/^\s*(?:[-*+]|\d+[.)])\s+/gm, '')
    .replace(/^>\s?/gm, '')
    .replace(/[*_`~]/g, '')
    .replace(/\s+/g, ' ').trim();
}
function excerpt(md, n = 150) { const p = plain(md); return p.length > n ? p.slice(0, n).replace(/\s\S*$/, '') + '…' : p; }
const countWords = md => { const p = plain(md); return p ? p.split(' ').length : 0; };
function cleanTags(input) {
  const arr = Array.isArray(input) ? input : String(input || '').split(/[,\s]+/);
  const out = [];
  for (let t of arr) { t = String(t).trim().replace(/^#+/, '').toLowerCase(); if (t && t.length <= 40 && !out.includes(t)) out.push(t); }
  return out.slice(0, 24);
}
const cleanPasta = p => String(p || '').split('/').map(x => x.trim()).filter(Boolean).join(' / ').slice(0, 200);
function coerce(id, d) {
  if (!d || typeof d !== 'object') return null;
  const title = String(d.title ?? '').trim().replace(/\s+/g, ' ');
  if (!title) return null;
  return {
    id, title: title.slice(0, 200), body: String(d.body ?? ''),
    type: TYPE[d.type] ? d.type : 'nota', tags: cleanTags(d.tags), fav: !!d.fav, pasta: cleanPasta(d.pasta), src: typeof d.src === 'string' ? d.src.slice(0, 400) : '',
    created: +d.created || +d.updated || 0, updated: +d.updated || +d.created || 0,
  };
}
function normWithMap(s) {
  let out = ''; const map = [];
  for (let i = 0; i < s.length; i++) {
    const c = s[i].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    for (let j = 0; j < c.length; j++) { out += c[j]; map.push(i); }
  }
  return { out, map };
}
function highlight(text, words) {
  words = words.filter(Boolean);
  if (!words.length) return esc(text);
  const { out, map } = normWithMap(text);
  const ranges = [];
  for (const w of words) { let i = 0; while ((i = out.indexOf(w, i)) !== -1) { ranges.push([map[i], map[i + w.length - 1] + 1]); i += w.length; } }
  if (!ranges.length) return esc(text);
  ranges.sort((a, b) => a[0] - b[0]);
  let html = '', pos = 0;
  for (const [a, b] of ranges) { if (a < pos) continue; html += esc(text.slice(pos, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>'; pos = b; }
  return html + esc(text.slice(pos));
}
function snippet(body, words, len = 160) {
  const p = plain(body);
  const { out, map } = normWithMap(p);
  let first = -1;
  for (const w of words) { if (!w) continue; const i = out.indexOf(w); if (i !== -1 && (first === -1 || i < first)) first = i; }
  if (first === -1) return esc(p.slice(0, len)) + (p.length > len ? '…' : '');
  const start = Math.max(0, map[first] - 50);
  const s = p.slice(start, start + len);
  return (start > 0 ? '…' : '') + highlight(s, words) + (start + len < p.length ? '…' : '');
}

const ICONS = {
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h10"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  more: '<circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/>',
  shuffle: '<path d="M16 4h4v4M4 18 20 4M20 16v4h-4M14.5 14.5 20 20M4 6l5 5"/>',
  calendar: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  back: '<path d="M15 6l-6 6 6 6"/>',
  star: '<path d="m12 4 2.4 5 5.4.6-4 3.7 1.1 5.4L12 16l-4.9 2.7 1.1-5.4-4-3.7 5.4-.6z"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  trash: '<path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/>',
  focus: '<circle cx="12" cy="12" r="2.4"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  zoomIn: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2M8 11h6M11 8v6"/>',
  zoomOut: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2M8 11h6"/>',
  fit: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  spark: '<path d="M12 3c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z"/><path d="M19 3v3M17.5 4.5h3"/>',
  upload: '<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>',
  download: '<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>',
  keyboard: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  check: '<path d="m5 12 5 5 9-10"/>',
  eye: '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>',
  eyeOff: '<path d="M3 3l18 18M10.6 6.1A10 10 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-3.3 4M6.6 6.6C3.8 8.4 2 12 2 12s3.6 6.5 10 6.5c1.7 0 3.2-.4 4.5-1.1"/>',
  archive: '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/>',
};
const icon = (n, fill = 'none') => `<svg viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ---------- state ---------- */
const S = Object.assign({ layout: 'tema', tagNodes: false, ghosts: false, concepts: true, orphans: true, labels: false, signals: true, repel: 75, dist: 40 }, lsGet('settings2', {}));
if (!['tema', 'pasta', 'tag', 'tipo', 'livre'].includes(S.layout)) S.layout = 'tema';
const state = {
  notes: new Map(), loaded: false, mode: 'loading', canWrite: true,
  hidden: new Set(lsGet('hidden', [])),
  hoverId: null, selectedId: null, local: null,
  search: { q: '', ids: null, results: [], active: 0, createIdx: -1 },
  sample: null, downloads: null, mcp: null,
};
let idx = { byKey: new Map(), out: new Map(), back: new Map(), tags: new Map() };

function reindex() {
  const byKey = new Map(), out = new Map(), back = new Map(), tags = new Map();
  for (const n of state.notes.values()) byKey.set(norm(n.title), n);
  for (const n of state.notes.values()) {
    const self = norm(n.title), keys = new Map();
    const src = n.body.replace(/```[\s\S]*?```/g, '').replace(/`[^`\n]*`/g, '');
    for (const m of src.matchAll(LINK_RE)) {
      const { target } = parseLink(m[1]);
      if (!target) continue;
      const k = norm(target);
      if (k === self || keys.has(k)) continue;
      keys.set(k, target);
    }
    out.set(n.id, keys);
    for (const k of keys.keys()) { if (!back.has(k)) back.set(k, new Set()); back.get(k).add(n.id); }
    for (const t of n.tags) tags.set(t, (tags.get(t) || 0) + 1);
  }
  idx = { byKey, out, back, tags };
}

/* ---------- storage ---------- */
const store = {
  col: null, chains: new Map(),
  async start() {
    let db = null;
    try { db = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('db') : null; } catch { db = null; }
    if (db) {
      state.mode = 'db';
      this.col = db.collection('notes');
      this.subscribe();
      try {
        const user = await window.claude.use('user');
        if (user && (await user.can('data.write')) === false) setReadOnly(true);
      } catch {}
    } else {
      state.mode = 'local';
      const arr = lsGet('notes', []);

function parseMarkdownFile(name, text, mtime, relPath = '') {
  let title = name.replace(/\.(md|markdown|txt)$/i, '').trim();
  let body = text.replace(/\r\n?/g, '\n');
  const tags = []; let type = 'nota', typeGiven = false, created = mtime || Date.now(), pasta = '';
  const fm = /^---\n([\s\S]*?)\n---[ \t]*\n?/.exec(body);

    const y = fm[1];
    const tl = /^title:\s*(.+)$/mi.exec(y); if (tl) title = tl[1].trim().replace(/^["']|["']$/g, '') || title;
    const ty = /^(?:tipo|type):\s*(.+)$/mi.exec(y);
    if (ty) { const v = norm(ty[1].replace(/["']/g, '')); const f = TYPE_LIST.find(t => t.key === v || norm(t.label) === v); if (f) { type = f.key; typeGiven = true; } }
    const inl = /^tags:\s*\[(.*)\]\s*$/mi.exec(y);

    else {
      const blk = /^tags:[ \t]*\n((?:[ \t]*-[ \t]*.+(?:\n|$))+)/mi.exec(y);
      if (blk) tags.push(...blk[1].split('\n').map(s => s.replace(/^\s*-\s*/, '')));
      else { const one = /^tags:[ \t]*(\S.*)$/mi.exec(y); if (one) tags.push(...one[1].split(/[,\s]+/)); }
    }
    const pa = /^pasta:\s*(.+)$/mi.exec(y); if (pa) pasta = pa[1].trim().replace(/^["']|["']$/g, '');
    const cr = /^(?:criado|created|date):\s*(.+)$/mi.exec(y);
    if (cr) { const t = Date.parse(cr[1].trim().replace(/["']/g, '')); if (t) created = t; }
  }
  for (const m of body.matchAll(/(^|\s)#([\p{L}\p{N}_\-\/]+)/gu)) if (!/^\d+$/.test(m[2])) tags.push(m[2]);
  if (/^\d{4}-\d{2}-\d{2}$/.test(title) && !typeGiven) { type = 'diario'; typeGiven = true; }
  if (!pasta && relPath.includes('/')) pasta = relPath.split('/').slice(1, -1).join(' / ');
  return { pasta: cleanPasta(pasta), title: title.replace(/\s+/g, ' ').slice(0, 200) || 'Sem título', body: body.trim(), type, typeGiven, tags: cleanTags(tags.map(t => String(t).trim().replace(/^["'#]+|["']+$/g, ''))), created };
}
async function importFiles(fileList) {
  if (!state.canWrite) return;
  const files = [...fileList].filter(f => /\.(md|markdown|txt|json)$/i.test(f.name) && !/(^|\/)\.(obsidian|trash|git)\//.test(f.webkitRelativePath || ''));
  if (!files.length) { toast('Nenhum arquivo .md, .txt ou .json encontrado.', 'error'); return; }
  toast(`Lendo ${files.length} ${files.length === 1 ? 'arquivo' : 'arquivos'}…`, '', 60000);
  const incoming = [];
  for (const f of files) {
    let text;
    try { text = await f.text(); } catch { continue; }
    if (/\.json$/i.test(f.name)) {
      try {
        const data = JSON.parse(text);
        const arr = Array.isArray(data) ? data : Array.isArray(data.notes) ? data.notes : [];
        for (const d of arr) { const n = coerce('x', d); if (n) incoming.push({ pasta: n.pasta, title: n.title, body: n.body, type: n.type, typeGiven: true, tags: n.tags, created: n.created || Date.now(), fav: n.fav }); }
      } catch { toast(`“${f.name}” não é um backup JSON válido.`, 'error'); }
      continue;
    }
    incoming.push(parseMarkdownFile(f.name, text, f.lastModified, f.webkitRelativePath || ''));
  }
  const byKey = new Map(idx.byKey);
  const ops = [];
  let created = 0, updated = 0;
  for (const inc of incoming) {
    const k = norm(inc.title), ex = byKey.get(k), now = Date.now();
    let note;
    if (ex) { note = { ...ex, pasta: inc.pasta || ex.pasta, body: inc.body || ex.body, tags: cleanTags([...ex.tags, ...inc.tags]), type: inc.typeGiven ? inc.type : ex.type, fav: ex.fav || !!inc.fav, updated: now }; updated++; }
    else { note = { id: uid(), pasta: inc.pasta || '', title: inc.title, body: inc.body, type: inc.type, tags: inc.tags, fav: !!inc.fav, created: inc.created || now, updated: now }; created++; }
    byKey.set(k, note); ops.push(note);
  }
  let done = 0;
  const it = ops[Symbol.iterator]();
  const worker = async () => { for (let r = it.next(); !r.done; r = it.next()) { await store.put(r.value); done++; if (done % 10 === 0) toast(`Importando… ${done} de ${ops.length}`, '', 60000); } };
  await Promise.all([worker(), worker(), worker()]);
  toast(`Importação concluída: ${created} ${created === 1 ? 'nota nova' : 'notas novas'}, ${updated} ${updated === 1 ? 'atualizada' : 'atualizadas'}.`, '', 5000);
  if (G) setTimeout(() => fit(900), 1400);
}

async function importNotion() {
  if (!state.mcp || !state.canWrite) return;
  const ok = await confirmBox({ title: 'Importar do Notion?', body: 'Vou ler todas as páginas, subpáginas e bancos de dados que a sua conexão do Notion enxerga e transformar cada uma em nota, na pasta Notion e com a tag #notion. Links entre páginas viram ligações no grafo. Rodar de novo atualiza as notas, sem duplicar. O Claude pode pedir sua permissão para usar o Notion nesta página.', confirm: 'Importar tudo' });

  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="nxT"><h2 id="nxT">Importando do Notion</h2><p id="nxS">Listando suas páginas…</p><div class="thinking" id="nxB"><span class="pulse"></span><span id="nxC">Começando</span></div><div class="acts" style="margin-top:18px"><button class="btn" id="nxStop">Parar</button></div></div>`;
  document.body.appendChild(back);
  const st = t => { $('#nxS', back).textContent = t; }, ct = t => { $('#nxC', back).textContent = t; };
  let stop = false, done = false;
  $('#nxStop', back).onclick = () => { if (done) back.remove(); else { stop = true; st('Parando depois das páginas em andamento…'); } };
  const finish = msg => { done = true; st(msg); $('#nxB', back).hidden = true; $('#nxStop', back).textContent = 'Fechar'; };
  const call = async (tool, input) => {
    try { return (await state.mcp.callTool(NOTION, tool, input)).payload; }
    catch (e) {
      if (e && e.retryable) { await sleep(Math.min(e.retryAfterMs || 1500, 8000) + Math.random() * 500); return (await state.mcp.callTool(NOTION, tool, input)).payload; }
      throw e;
    }
  };
  const fatal = e => e && NOTION_FATAL[e.code];
  try {
    const roots = [];
    for (const tool of ['notion-list-private-pages', 'notion-list-shared-pages']) {
      let cursor;
      for (let i = 0; i < 25; i++) {
        let pl;
        try { pl = await call(tool, cursor ? { limit: 200, cursor } : { limit: 200 }); }
        catch (e) { if (fatal(e)) throw e; break; }
        for (const r of (pl && pl.results) || []) roots.push(r);
        cursor = pl && (pl.next_cursor || pl.nextCursor || pl.cursor);
        if (!cursor || pl.has_more === false) break;
      }
    }
    if (!roots.length) { finish('Não encontrei nenhuma página no seu Notion. Confira se a conexão do Notion tem acesso às suas páginas.'); return; }
    const queue = roots.map(r => ({ url: r.url, title: r.title, path: [], kind: r.type }));
    const pages = new Map(), seen = new Set(), order = [];
    let skipped = 0;
    const MAX = 800;
    const worker = async () => {
      while (queue.length && !stop && pages.size < MAX) {
        const item = queue.shift();
        const id = notionId(item.url);
        if (!id || seen.has(id)) continue;
        seen.add(id);
        let pl;
        try { pl = await call('notion-fetch', { id: item.url }); }
        catch (e) { if (fatal(e)) throw e; skipped++; continue; }
        if (!pl || typeof pl !== 'object' || !pl.text) { skipped++; continue; }
        const kind = (pl.metadata && pl.metadata.type) || item.kind || 'page';
        const title = cleanNotionTitle(pl.title || item.title) || 'Sem título';
        const rec = { id, url: String(pl.url || item.url).split('?')[0], title, path: item.path, kind, text: pl.text, edited: Date.parse(pl.page_last_edited_at) || 0, children: [] };
        pages.set(id, rec); order.push(rec);
        const childPath = [...item.path, title];
        if (kind === 'database') {
          for (const ds of [...new Set(pl.text.match(/collection:\/\/[0-9a-f-]+/g) || [])]) {
            if (stop) break;
            let q;
            try { q = await call('notion-query-data-sources', { data: { mode: 'rows', data_source_url: ds, limit: 100 } }); }
            catch (e) { if (fatal(e)) throw e; continue; }
            const urls = new Set(JSON.stringify(q || {}).match(/https:\/\/(?:app\.notion\.com|www\.notion\.so)\/[^"\s\\]*[0-9a-f]{32}[^"\s\\]*/gi) || []);
            for (const u of urls) { const cid = notionId(u); if (cid && cid !== id) { rec.children.push(cid); queue.push({ url: u, path: childPath, kind: 'page' }); } }
          }
        } else {
          for (const m of notionContent(pl.text).matchAll(/<(page|database)\b[^>]*?\surl="\{*([^"}]+)\}*"[^>]*>([\s\S]*?)<\/\1>/g)) {
            const cid = notionId(m[2]);

          }

        ct(title);
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    if (!pages.size) { finish('Não consegui ler nenhuma página do Notion.'); return; }
    // titles
    const taken = new Map();
    for (const n of state.notes.values()) if (!n.id.startsWith('notion-')) taken.set(norm(n.title), n.id);
    const idTitle = new Map();
    for (const rec of order) {
      let t = rec.title, i = 2;
      if (taken.has(norm(t))) t = `${rec.title} (${rec.path[rec.path.length - 1] || 'Notion'})`;
      const base = t;
      while (taken.has(norm(t))) t = `${base} ${i++}`;
      taken.set(norm(t), 'notion-' + rec.id);
      idTitle.set(rec.id, t);
    }
    const linkFor = (cid, fallback) => cid && idTitle.has(cid) ? `[[${idTitle.get(cid)}]]` : fallback;
    const ops = [];
    for (const rec of order) {
      const docId = 'notion-' + rec.id, ex = state.notes.get(docId);
      let body = notionToMd(rec.text, linkFor);
      const props = notionProps(rec.text);
      if (props.length) body = props.join('\n') + (body ? '\n\n' + body : '');
      if (rec.kind === 'database') {
        const rows = rec.children.filter(c => idTitle.has(c)).map(c => `- [[${idTitle.get(c)}]]`);
        body = 'Banco de dados do Notion.' + (rows.length ? '\n\n## Itens\n' + rows.join('\n') : '\n\nSem itens.');
      } else {
        const missing = rec.children.filter(c => idTitle.has(c) && !body.includes(`[[${idTitle.get(c)}]]`));
        if (missing.length) body += '\n\n## Subpáginas\n' + missing.map(c => `- [[${idTitle.get(c)}]]`).join('\n');
      }
      body = (body.length > 190000 ? body.slice(0, 190000) + '\n\n…(texto cortado)' : body) + `\n\n---\n[Abrir no Notion](${rec.url})\n`;
      const type = rec.kind === 'database' || rec.children.length >= 3 ? 'mapa' : 'nota';
      const pasta = ['Notion', ...(rec.path.length ? rec.path : rec.children.length ? [rec.title] : ['Páginas avulsas'])].map(x => x.replace(/\//g, '-')).join(' / ');
      const note = { id: docId, title: idTitle.get(rec.id), body, type: ex && ex.type !== 'nota' && ex.type !== 'mapa' ? ex.type : type, pasta, src: rec.url,
        tags: cleanTags([...(ex ? ex.tags : []), 'notion']), fav: ex ? ex.fav : false, created: ex ? ex.created : (rec.edited || Date.now()), updated: rec.edited || Date.now() };
      if (ex && ex.title === note.title && ex.body === note.body && ex.pasta === note.pasta && ex.type === note.type) continue;
      ops.push(note);
    }
    let written = 0;
    const it = ops[Symbol.iterator]();
    const writer = async () => { for (let r = it.next(); !r.done; r = it.next()) { await store.put(r.value); written++; ct(`Salvando ${written} de ${ops.length}`); } };
    st(`Salvando ${ops.length} ${ops.length === 1 ? 'nota' : 'notas'}…`);
    await Promise.all([writer(), writer(), writer()]);
    finish(`${stop ? 'Importação interrompida. ' : 'Pronto. '}${pages.size} ${pages.size === 1 ? 'página lida' : 'páginas lidas'}, ${ops.length} ${ops.length === 1 ? 'nota criada ou atualizada' : 'notas criadas ou atualizadas'}${skipped ? `, ${skipped} não puderam ser abertas` : ''}${pages.size >= MAX ? `. Parei no limite de ${MAX} páginas; rode de novo para continuar` : ''}. Veja tudo em Pastas → Notion.`);
    if (S.layout !== 'pasta') setLayout('pasta'); else setTimeout(() => fit(800), 1500);
  } catch (e) {
    finish(NOTION_FATAL[e && e.code] || (e && e.code === 'tool_error' ? 'O Notion recusou o pedido: ' + (e.message || '') : 'Não consegui falar com o Notion agora. Tente de novo em instantes.'));
  }
}

      case 'e': case 'E': if (drawer.cur && drawer.cur.kind === 'note' && state.canWrite) { e.preventDefault(); startEdit(drawer.cur.id); } break;
      case 'l': case 'L': if (drawer.cur && drawer.cur.kind === 'note') toggleLocal(drawer.cur.id); break;
      case 'a': case 'A': if (state.sample) { e.preventDefault(); openAsk(); } break;
      case 'g': case 'G': if (G) fit(600); break;
      case '?': showHelp(); break;
    }
  });
  mqMobile.addEventListener('change', () => closeRail());
}

/* ---------- boot ---------- */
window.addEventListener('error', e => { if (e && e.message) reportError('carregar a página', e.error || e.message); });
window.addEventListener('unhandledrejection', e => reportError('carregar os dados', e.reason));
function boot() {
  if (lsGet('railCollapsed', false) && !mqMobile.matches) $('#app').classList.add('rail-collapsed');
  safe('preparar a página', wire);
  safe('aplicar as preferências', applySettingsToUI);
  safe('montar o menu', renderMenu);
  safe('desenhar o fundo', drawStars);
  safe('iniciar o grafo', initGraph);
  safe('montar a barra lateral', renderRail);
  renderOverlay();
  store.start().catch(e => reportError('conectar às notas', e));
  const use = name => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(name).catch(() => null) : Promise.resolve(null);
  use('sample').then(s => { if (s) { state.sample = s; $('#btnAsk').hidden = false; if (!editor) refreshDrawer(); } });
  use('downloads').then(d => { if (d) { state.downloads = d; renderMenu(); } });
  use('mcp').then(m => { if (m) { state.mcp = m; renderMenu(); renderOverlay(true); } });
}
boot();
})();
</script>
